      <div class="field"><label>Nhận lúc *</label><input type="datetime-local" id="f-pickup" value="${defaultPickupLocalInput()}" required></div>
      <div class="chips">
        <button type="button" class="chip" id="chip-pickup-today">Hôm nay</button>
        <button type="button" class="chip" id="chip-pickup-tomorrow">Ngày mai</button>
      </div>
      <div class="field"><label>Trả lúc</label><input type="datetime-local" id="f-return"></div>
      ${itemPickerBlockHtml('f')}
      <div class="field"><label>Ghi chú món/đồ ngoài kho</label><textarea id="f-items"></textarea></div>
      <div class="field"><label>Tiền thuê</label><input type="text" inputmode="numeric" id="f-price"><div class="amount-words" id="f-price-words"></div></div>
      <div class="field"><label>Tiền cọc</label><input type="text" inputmode="numeric" id="f-deposit" value="0"><div class="amount-words" id="f-deposit-words"></div></div>
      <div class="field">
        <label>Hình thức cọc</label>
        <select id="f-deposit-type">
          <option value="cash">Tiền mặt</option>
          <option value="cccd">CCCD</option>
          <option value="cash_cccd">Tiền mặt + CCCD</option>
          <option value="none">Không cọc</option>
        </select>
      </div>
      <div class="field"><label>Ghi chú</label><textarea id="f-note"></textarea></div>
      <div class="field"><label><input type="checkbox" id="f-giao-ngay"> Giao đồ luôn (khách lấy ngay)</label></div>
      <div class="modal-actions sticky-submit">
        <button type="submit" class="btn">Lưu đơn</button>
      </div>
    </form>
  `);
  attachMoneyFormatting(document.getElementById('f-price'));
  attachMoneyFormatting(document.getElementById('f-deposit'));
  attachAmountInWords(document.getElementById('f-price'), document.getElementById('f-price-words'));
  attachAmountInWords(document.getElementById('f-deposit'), document.getElementById('f-deposit-words'));

  const itemPicker = wireItemPickerBlock({
    idPrefix:'f', pickupId:'f-pickup', returnId:'f-return',
    priceFieldId:'f-price', depositFieldId:'f-deposit',
    excludeOrderId:null, initialEntries:[],
    saveBtnSelector:'#new-order-form button[type=submit]'
  });

  // B3: "Trả lúc" tự = "Nhận lúc" + 24h khi đang trống hoặc chưa bị người dùng sửa tay.
  let returnDirty = false;
  document.getElementById('f-return').addEventListener('input', ()=>{ returnDirty = true; });
  function autoFillReturn(){
    if(returnDirty && document.getElementById('f-return').value) return;
    const pickupVal = document.getElementById('f-pickup').value;
    if(!pickupVal) return;
    const pickupISO = vnLocalInputToISO(pickupVal);
    if(!pickupISO) return;
    const returnMs = new Date(pickupISO).getTime() + 24*3600000;
    document.getElementById('f-return').value = isoToVnLocalInput(new Date(returnMs).toISOString());
  }
  document.getElementById('f-pickup').addEventListener('change', ()=>{ autoFillReturn(); itemPicker.recomputeAll(); });
  document.getElementById('f-return').addEventListener('change', ()=>itemPicker.recomputeAll());
  autoFillReturn();
  itemPicker.recomputeAll();

  // B3: chip [Hôm nay]/[Ngày mai] chỉ đổi phần NGÀY, giữ nguyên giờ đang chọn.
  function setPickupDateKeepTime(targetDateStr){
    const inp = document.getElementById('f-pickup');
    const timePart = (inp.value && inp.value.split('T')[1]) || '00:00';
    inp.value = `${targetDateStr}T${timePart}`;
    inp.dispatchEvent(new Event('change'));
  }
  document.getElementById('chip-pickup-today').addEventListener('click', ()=>setPickupDateKeepTime(vnDateStr()));
  document.getElementById('chip-pickup-tomorrow').addEventListener('click', ()=>{
    setPickupDateKeepTime(vnDateStr(new Date(Date.now()+24*3600000)));
  });

  const phoneInput = document.getElementById('f-phone');
  let foundCustomerId = null;
  phoneInput.addEventListener('blur', async ()=>{
    const phone = phoneInput.value.trim();
    const noteEl = document.getElementById('known-cust-note');
    foundCustomerId = null;
    noteEl.style.display = 'none';
    if(!phone) return;
    const {data} = await sb.from('customers').select('id,name').eq('phone',phone).maybeSingle();
    if(data){
      foundCustomerId = data.id;
      document.getElementById('f-name').value = data.name;
      noteEl.textContent = `Khách quen: ${data.name}`;
      noteEl.style.display = 'block';
    }
  });

  document.getElementById('new-order-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    const giaoNgay = document.getElementById('f-giao-ngay').checked;
    const name = document.getElementById('f-name').value.trim();
    const phone = phoneInput.value.trim();
    const items = document.getElementById('f-items').value.trim();
    const pickup = document.getElementById('f-pickup').value;
    let ret = document.getElementById('f-return').value;
    const price = parseMoneyInput(document.getElementById('f-price').value);
    const deposit = parseMoneyInput(document.getElementById('f-deposit').value);
    const depositType = document.getElementById('f-deposit-type').value;
    let note = document.getElementById('f-note').value.trim();

    if(!pickup){ toast('Nhập giờ nhận đồ'); return; }
    // B8: "Trả lúc" trống khi submit → tự = nhận + 24h (không chặn lưu đơn tạm chưa chốt giờ trả).
    if(!ret){
      const pickupISOTmp = vnLocalInputToISO(pickup);
      ret = isoToVnLocalInput(new Date(new Date(pickupISOTmp).getTime() + 24*3600000).toISOString());
    }
    const pickupISO = vnLocalInputToISO(pickup);
    const returnISO = vnLocalInputToISO(ret);
    if(new Date(returnISO) <= new Date(pickupISO)){ toast('Giờ trả phải sau giờ nhận'); return; }
    // B8: tiền thuê = 0 (đơn giữ chỗ miệng, chưa chốt giá) → gắn nhãn rõ ràng vào đầu ghi chú.
    if(price === 0){
      note = note ? `[Đơn tạm — chưa chốt giá] ${note}` : '[Đơn tạm — chưa chốt giá]';
    }

    // Chặn lưu nếu có món đang chọn bị trùng lịch/không khả dụng (phòng vệ thêm ngoài việc disable nút, finding-style)
    itemPicker.recomputeAll();
    if(itemPicker.state.entries.some(e=>e.conflict)){ toast('Có món đang trùng lịch/không khả dụng, không thể lưu'); return; }
    if(!items && !itemPicker.state.entries.length){ toast('Chọn ít nhất 1 món từ kho hoặc ghi chú món ngoài kho'); return; }

    btn.disabled = true;
    // Tự truy vấn khách theo SĐT ngay tại thời điểm submit thay vì tin biến foundCustomerId
    // do blur set trước đó (race condition, finding #10)
    let customerId = null;
    if(phone){
      const {data: existingCust} = await sb.from('customers').select('id,name').eq('phone', phone).maybeSingle();
      if(existingCust) customerId = existingCust.id;
    }
    if(!customerId){
      const insertPayload = {name};
      if(phone) insertPayload.phone = phone;
      const {data:newCust, error:custErr} = await sb.from('customers').insert(insertPayload).select().single();
      if(custErr){ toast('Lỗi tạo khách: '+viError(custErr), 4000); btn.disabled = false; return; }
      customerId = newCust.id;
    }

    const {data:newOrder, error} = await sb.from('orders').insert({
      customer_id: customerId,
      items_text: items || null,
      pickup_at: pickupISO,
      return_due_at: returnISO,
      rental_price: price,
      deposit_amount: deposit,
      deposit_type: depositType,
      note: note || null
    }).select().single();
    if(error){ toast('Lỗi tạo đơn: '+viError(error), 4000); btn.disabled = false; return; }
    if(itemPicker.state.entries.length){
      const rows = itemPicker.state.entries.map(e=>({order_id:newOrder.id, item_id:e.item.id, price:Number(e.price||0)}));
      const {error: oiErr} = await sb.from('order_items').insert(rows);
      if(oiErr){ toast('Đã tạo đơn nhưng lỗi lưu món: '+viError(oiErr), 4000); }
    }
    closeModal();
    // B7: "Giao đồ luôn" → lưu đơn xong tự chạy flow giao đồ (modal thu tiền), thay vì phải tự đi tìm lại đơn.
    if(giaoNgay){
      toast('Đã tạo đơn mới');
      flowBookedToPickedUp(newOrder.id, ()=>renderOrders());
    } else {
      toast('Đã tạo đơn mới');
      renderOrders();
    }
  });
}

/* ---------- Chi tiết đơn ---------- */
async function openOrderDetail(orderId){
  const {data: order} = await sb.from('orders').select('*').eq('id', orderId).single();
  if(!order){ toast('Không tìm thấy đơn'); return; }
  const {data: customer} = await sb.from('customers').select('*').eq('id', order.customer_id).maybeSingle();
  const {data: tx} = await sb.from('transactions').select('*').eq('order_id', orderId).order('occurred_at',{ascending:false});
  const {data: orderItemsRows} = await sb.from('order_items').select('*, item:items(*)').eq('order_id', orderId);
  const orderTx = tx || [];
  const orderItemsList = (orderItemsRows||[]).filter(oi=>oi.item);
  const remaining = orderRemaining(order, orderTx);
  const held = depositHeld(order);

  let actionsHtml = '';
  if(order.status === 'booked'){
    actionsHtml += `<button class="btn block-sm" data-act="booked-to-pickedup">Đã giao đồ</button>`;
    actionsHtml += `<button class="btn danger block-sm" data-act="cancel-order">Hủy đơn</button>`;
  }
  if(order.status === 'picked_up'){
    actionsHtml += `<button class="btn block-sm" data-act="pickedup-to-returned">Đã nhận lại đồ</button>`;
    actionsHtml += `<button class="btn ghost block-sm" data-act="revert-to-booked">↩ Quay lại: chưa giao đồ</button>`;
  }
  if(order.status === 'returned' && isCashDeposit(order)){
    actionsHtml += `<button class="btn block-sm" data-act="return-deposit">Hoàn cọc</button>`;
  } else if(order.status === 'returned' && !isCashDeposit(order)){
    // Đơn đã trả đồ nhưng không (còn) có cọc tiền mặt (vd: sửa đơn đổi cọc về none sau khi trả đồ) → không kẹt vĩnh viễn (finding #5)
    actionsHtml += `<button class="btn block-sm" data-act="close-order">Đóng đơn</button>`;
  }
  if(order.status === 'returned'){
    actionsHtml += `<button class="btn ghost block-sm" data-act="revert-to-pickedup">↩ Quay lại: khách đang giữ đồ</button>`;
  }
  if(order.status === 'closed'){
    actionsHtml += `<button class="btn ghost block-sm" data-act="reopen-to-returned">Mở lại đơn</button>`;
  }
  if(order.status === 'cancelled'){
    actionsHtml += `<button class="btn ghost block-sm" data-act="reopen-to-booked">Mở lại đơn</button>`;
  }
  if(remaining > 0 && !['booked','cancelled'].includes(order.status)){
    actionsHtml += `<button class="btn secondary block-sm" data-act="collect-remaining">Thu nốt ${money(remaining)}</button>`;
  }
  // A5: nút "Sửa đơn" hiện ở MỌI trạng thái (trước đây ẩn ở closed/cancelled).
  actionsHtml += `<button class="btn secondary block-sm" data-act="edit-order">Sửa đơn</button>`;

  openModal(`
    <h3>${order.code}</h3>
    <div class="kv"><span class="k">Khách</span><span class="v">${escapeHtml(customer?.name||'(?)')}</span></div>
    <div class="kv"><span class="k">SĐT</span><span class="v">${customer?.phone ? `<a class="tel-link" href="tel:${escapeHtml(customer.phone)}">${escapeHtml(customer.phone)}</a>` : '—'}</span></div>
    ${orderItemsList.length ? `<div class="kv"><span class="k">Món (kho)</span><span class="v">${orderItemsList.map(oi=>`<span class="item-link" data-item-id="${oi.item.id}" style="cursor:pointer;text-decoration:underline;">${escapeHtml(oi.item.name)}</span> (${money(oi.price)})`).join(', ')}</span></div>` : ''}
    ${order.items_text ? `<div class="kv"><span class="k">Món thuê (ghi chú)</span><span class="v">${escapeHtml(order.items_text)}</span></div>` : ''}
    <div class="kv"><span class="k">Nhận lúc</span><span class="v">${formatDateTimeVN(order.pickup_at)}</span></div>
    <div class="kv"><span class="k">Trả lúc (hạn)</span><span class="v">${formatDateTimeVN(order.return_due_at)}</span></div>
    ${order.returned_at ? `<div class="kv"><span class="k">Đã trả lúc</span><span class="v">${formatDateTimeVN(order.returned_at)}</span></div>` : ''}
    <div class="kv"><span class="k">Trạng thái</span><span class="v"><span class="badge ${order.status}">${STATUS_LABEL[order.status]}</span></span></div>
    <div class="kv"><span class="k">Tiền thuê</span><span class="v">${money(order.rental_price)}</span></div>
    <div class="kv"><span class="k">Còn thiếu</span><span class="v ${remaining>0?'remain-warn':''}">${money(remaining)}</span></div>
    <div class="kv"><span class="k">Tiền cọc</span><span class="v">${money(order.deposit_amount)} (${DEPOSIT_LABEL[order.deposit_type]})</span></div>
    ${isCashDeposit(order) ? `<div class="kv"><span class="k">Cọc đang giữ</span><span class="v">${money(held)}</span></div>` : ''}
    ${order.deposit_returned_amount!=null ? `<div class="kv"><span class="k">Đã hoàn cọc</span><span class="v">${money(order.deposit_returned_amount)} lúc ${formatDateTimeVN(order.deposit_returned_at)}</span></div>` : ''}
    ${order.note ? `<div class="kv"><span class="k">Ghi chú</span><span class="v">${escapeHtml(order.note)}</span></div>` : ''}

    <div class="section-title">Tiền đã thu/chi của đơn này</div>
    ${orderTx.length ? orderTx.map(t=>`
      <div class="tx-row">
        <div><div>${CAT_LABEL[t.category]||t.category}</div><div class="cat">${formatDateTimeVN(t.occurred_at)}</div></div>
        <div class="amt ${t.type}">${t.type==='thu'?'+':'-'}${money(t.amount)}</div>
      </div>`).join('') : `<div class="empty-state">Chưa có giao dịch</div>`}

    <div class="modal-actions" style="flex-wrap:wrap;">${actionsHtml}</div>
  `);

  const box = document.querySelector('.modal-box');
  box.querySelectorAll('.item-link').forEach(el=>{
    el.addEventListener('click', ()=>openItemDetail(el.dataset.itemId));
  });
  box.querySelector('[data-act="booked-to-pickedup"]')?.addEventListener('click', ()=>flowBookedToPickedUp(order.id, ()=>{ if(currentTab==='orders') renderOrders(); else renderToday(); }));
  box.querySelector('[data-act="pickedup-to-returned"]')?.addEventListener('click', ()=>flowPickedUpToReturned(order.id, ()=>{ if(currentTab==='orders') renderOrders(); else renderToday(); }));
  box.querySelector('[data-act="cancel-order"]')?.addEventListener('click', ()=>flowCancelOrder(order, ()=>renderOrders()));
  box.querySelector('[data-act="collect-remaining"]')?.addEventListener('click', ()=>flowCollectRemaining(order, remaining, ()=>{openOrderDetail(order.id);}));
  box.querySelector('[data-act="return-deposit"]')?.addEventListener('click', ()=>flowReturnDeposit(order, remaining, ()=>renderOrders()));
  box.querySelector('[data-act="close-order"]')?.addEventListener('click', async ()=>{
    const btn = box.querySelector('[data-act="close-order"]');
    btn.disabled = true;
    const {error} = await sb.from('orders').update({status:'closed'}).eq('id', order.id);
    if(error){ toastError(error); btn.disabled = false; return; }
    closeModal(); toast('Đã đóng đơn');
    if(currentTab==='orders') renderOrders(); else renderToday();
  });
  box.querySelector('[data-act="edit-order"]')?.addEventListener('click', ()=>openEditOrderModal(order, customer));

  // A5: đường lùi trạng thái (nút phụ, màu ghost, kèm confirm) — không đụng orderRemaining/depositHeld/isCashDeposit.
  box.querySelector('[data-act="revert-to-booked"]')?.addEventListener('click', async ()=>{
    if(!confirm('Quay lại trạng thái "chưa giao đồ"?')) return;
    const btn = box.querySelector('[data-act="revert-to-booked"]');
    btn.disabled = true;
    // Heuristic: không có cột liên kết trực tiếp giao dịch với flow đã tạo ra nó trong schema hiện
    // tại → coi khoản thu tien_thue CŨ NHẤT (orderTx đã sắp occurred_at GIẢM DẦN nên khoản cũ nhất
    // là phần tử CUỐI mảng) là khoản ghi khi giao đồ — đây là khoản thu ĐẦU TIÊN của đơn, ghi ngay
    // lúc giao đồ; các khoản thu sau đó (vd "Thu nốt") mới là gần nhất. Audit-batch-UX-1 #2: bản
    // trước lấy nhầm thueTx[0] (gần nhất) thay vì thueTx[length-1] (cũ nhất).
    const thueTx = orderTx.filter(t=>t.type==='thu' && t.category==='tien_thue');
    const oldestThueTx = thueTx.length ? thueTx[thueTx.length-1] : null;
    let deleteTx = false;
    if(oldestThueTx){
      deleteTx = confirm(`Xóa luôn khoản thu ${money(oldestThueTx.amount)} lúc ${formatDateTimeVN(oldestThueTx.occurred_at)} đã ghi khi giao đồ? OK = Xóa, Cancel = Giữ lại.`);
    }
    if(deleteTx){
      const {error: delErr} = await sb.from('transactions').delete().eq('id', oldestThueTx.id);
      if(delErr){ toast('Lỗi xóa giao dịch: '+viError(delErr), 4000); btn.disabled = false; return; }
    }
    const {error} = await sb.from('orders').update({status:'booked'}).eq('id', order.id);
    if(error){ toastError(error); btn.disabled = false; return; }
    closeModal(); toast('Đã quay lại: chưa giao đồ');
    if(currentTab==='orders') renderOrders(); else renderToday();
  });
  box.querySelector('[data-act="revert-to-pickedup"]')?.addEventListener('click', async ()=>{
    if(!confirm('Quay lại trạng thái "khách đang giữ đồ"?')) return;
    const btn = box.querySelector('[data-act="revert-to-pickedup"]');
    btn.disabled = true;
    const {error} = await sb.from('orders').update({status:'picked_up', returned_at:null}).eq('id', order.id);
    if(error){ toastError(error); btn.disabled = false; return; }
    closeModal(); toast('Đã quay lại: khách đang giữ đồ');
    if(currentTab==='orders') renderOrders(); else renderToday();
  });
  box.querySelector('[data-act="reopen-to-returned"]')?.addEventListener('click', async ()=>{
    if(!confirm('Mở lại đơn (về trạng thái "đã trả đồ")? Kiểm tra lại phần cọc và giao dịch nếu cần sửa.')) return;
    const btn = box.querySelector('[data-act="reopen-to-returned"]');
    btn.disabled = true;
    // A5: KHÔNG tự động đụng deposit_returned_amount/at hay bất kỳ giao dịch nào.
    const {error} = await sb.from('orders').update({status:'returned'}).eq('id', order.id);
    if(error){ toastError(error); btn.disabled = false; return; }
    closeModal(); toast('Đã mở lại đơn');
    if(currentTab==='orders') renderOrders(); else renderToday();
  });
  box.querySelector('[data-act="reopen-to-booked"]')?.addEventListener('click', async ()=>{
    // Audit-batch-UX-1 #7: cảnh báo phi_huy nêu rõ số tiền + ngày của giao dịch đó (đọc từ orderTx
    // có sẵn, không cần link phức tạp) thay vì chỉ nói chung chung "từng có khoản Phí hủy".
    const phiHuyTx = orderTx.find(t=>t.category==='phi_huy');
    const msg = phiHuyTx
      ? `Mở lại đơn (về trạng thái "đã đặt")? Đơn này từng có khoản "Phí hủy" ${money(phiHuyTx.amount)} lúc ${formatDateTimeVN(phiHuyTx.occurred_at)} — vào tab Thu chi để tự xử lý giao dịch đó nếu cần. Kiểm tra lại phần cọc và giao dịch nếu cần sửa.`
      : 'Mở lại đơn (về trạng thái "đã đặt")? Kiểm tra lại phần cọc và giao dịch nếu cần sửa.';
    if(!confirm(msg)) return;
    const btn = box.querySelector('[data-act="reopen-to-booked"]');
    btn.disabled = true;
    const {error} = await sb.from('orders').update({status:'booked'}).eq('id', order.id);
    if(error){ toastError(error); btn.disabled = false; return; }
    closeModal(); toast('Đã mở lại đơn');
    if(currentTab==='orders') renderOrders(); else renderToday();
  });
}

/* ---------- Flow: booked -> picked_up (thu tiền thuê) ---------- */
function flowBookedToPickedUp(orderId, onDone){
  Promise.all([
    sb.from('orders').select('*').eq('id',orderId).single(),
    sb.from('transactions').select('*').eq('order_id',orderId)
  ]).then(([{data:order}, {data:tx}])=>{
    // Prefill = số còn thiếu (không phải rental_price) để tránh thu trùng khi đơn đã thu một phần/toàn bộ trước đó (finding #1)
    const remaining = orderRemaining(order, tx || []);
    const prefill = Math.max(remaining, 0);
    openModal(`
      <h3>Xác nhận giao đồ</h3>
      <p>Thu tiền thuê cho đơn <b>${order.code}</b>:</p>
      <div class="field"><label>Số tiền thu</label><input type="text" inputmode="numeric" id="f-collect" value="${prefill.toLocaleString('vi-VN')}"></div>
      <div class="modal-actions">
        <button class="btn secondary" id="btn-skip-collect">Bỏ qua (chưa thu)</button>
        <button class="btn" id="btn-confirm-collect">Xác nhận thu & giao đồ</button>
      </div>
    `);
    attachMoneyFormatting(document.getElementById('f-collect'));
    document.getElementById('btn-skip-collect').addEventListener('click', async ()=>{
      const btn = document.getElementById('btn-skip-collect');
      btn.disabled = true;
      const {error} = await sb.from('orders').update({status:'picked_up'}).eq('id',orderId);
      if(error){ toastError(error); btn.disabled = false; return; }
      closeModal(); toast('Đã giao đồ'); onDone();
    });
    document.getElementById('btn-confirm-collect').addEventListener('click', async ()=>{
      const btn = document.getElementById('btn-confirm-collect');
      const amount = parseMoneyInput(document.getElementById('f-collect').value);
      if(amount > 0 && amount > remaining){ toast('Số tiền thu vượt quá còn thiếu ('+money(remaining)+')'); return; }
      btn.disabled = true;
      if(amount > 0){
        const {error:txErr} = await sb.from('transactions').insert({
          type:'thu', category:'tien_thue', amount, order_id: orderId
        });
        if(txErr){ toastError(txErr); btn.disabled = false; return; }
      }
      const {error} = await sb.from('orders').update({status:'picked_up'}).eq('id',orderId);
      if(error){ toastError(error); btn.disabled = false; return; }
      closeModal(); toast('Đã giao đồ'); onDone();
    });
  });
}

/* ---------- Flow: thu nốt (còn thiếu) ---------- */
function flowCollectRemaining(order, remaining, onDone){
  openModal(`
    <h3>Thu nốt tiền thuê</h3>
    <p>Đơn <b>${order.code}</b> — còn thiếu ${money(remaining)}</p>

  `);
  attachMoneyFormatting(document.getElementById('f-collect2'));
  document.getElementById('btn-confirm-collect2').addEventListener('click', async ()=>{
    const btn = document.getElementById('btn-confirm-collect2');

    if(amount<=0){ toast('Số tiền phải > 0'); return; }

/* ---------- Flow: picked_up -> returned (+ auto closed nếu không cọc tiền mặt) ---------- */
// Định dạng "trễ X" cho modal thu phí trễ (B5) — hiển thị thuần túy, không phải 1 trong 3 hàm lịch thuần.
function formatOverdueDuration(returnDueAt){
  const diffMs = Date.now() - new Date(returnDueAt).getTime();
  const hours = Math.floor(diffMs/3600000);
  if(hours < 1){
    const minutes = Math.max(0, Math.floor(diffMs/60000));
    return `${minutes} phút`;
  }
  if(hours < 24) return `${hours} giờ`;
  const days = Math.floor(hours/24);
  return `${days} ngày`;
}
function flowPickedUpToReturned(orderId, onDone){
  Promise.all([
    sb.from('orders').select('*').eq('id',orderId).single(),
    sb.from('order_items').select('item_id, item:items(id,buffer_hours)').eq('order_id', orderId)
  ]).then(([{data:order}, {data:orderItemsRows}])=>{
    const orderItemsList = (orderItemsRows||[]).filter(oi=>oi.item);
    const isOverdue = order.status==='picked_up' && new Date(order.return_due_at).getTime() < Date.now();

    if(isOverdue){
      // B5: đơn quá hạn → hỏi thu phí trễ trước khi chuyển trạng thái.
      openModal(`
        <h3>Khách trả trễ ${formatOverdueDuration(order.return_due_at)}</h3>
        <p>Hạn trả: ${formatDateTimeVN(order.return_due_at)}. Thu phí trễ?</p>
        <div class="field"><label>Số tiền thu phí trễ</label><input type="text" inputmode="numeric" id="f-latefee" value="0"></div>
        <div class="modal-actions">
          <button class="btn secondary" id="btn-skip-latefee">Bỏ qua</button>
          <button class="btn" id="btn-confirm-latefee">Thu</button>
        </div>
      `);
      attachMoneyFormatting(document.getElementById('f-latefee'));
      document.getElementById('btn-skip-latefee').addEventListener('click', ()=>{
        proceedAfterReturn(order, orderItemsList, onDone);
      });
      document.getElementById('btn-confirm-latefee').addEventListener('click', async ()=>{
        const btn = document.getElementById('btn-confirm-latefee');
        const amount = parseMoneyInput(document.getElementById('f-latefee').value);
        btn.disabled = true;
        if(amount > 0){
          const {error:txErr} = await sb.from('transactions').insert({type:'thu', category:'phi_tre', amount, order_id: order.id});
          if(txErr){ toastError(txErr); btn.disabled = false; return; }
        }
        proceedAfterReturn(order, orderItemsList, onDone);
      });
    } else {
      // Đơn đúng hạn giữ hành vi 1 chạm như cũ (không hỏi phí trễ).
      proceedAfterReturn(order, orderItemsList, onDone);
    }
  });
}
// Chuyển trạng thái sau khi nhận lại đồ (returned/closed tùy isCashDeposit — GIỮ NGUYÊN công thức),
// sau đó B6: nếu đơn có món từ kho với buffer_hours > 0 thì hỏi có cần đánh dấu đang giặt không.
async function proceedAfterReturn(order, orderItemsList, onDone){
  const nowISO = new Date().toISOString();
  const newStatus = isCashDeposit(order) ? 'returned' : 'closed';
  const {error} = await sb.from('orders').update({status:newStatus, returned_at: nowISO}).eq('id',order.id);
  if(error){ toastError(error); return; }
  const msg = isCashDeposit(order) ? 'Đã nhận lại đồ. Còn cọc cần hoàn.' : 'Đã nhận lại đồ. Đơn hoàn tất (không có cọc tiền mặt).';
  const itemsNeedingLaundryCheck = orderItemsList.filter(oi=>Number(oi.item && oi.item.buffer_hours||0) > 0);
  if(itemsNeedingLaundryCheck.length){
    closeModal();
    toast(msg);
    openModal(`
      <h3>Món cần giặt?</h3>
      <p>Đơn có ${itemsNeedingLaundryCheck.length} món có thời gian nghỉ giặt sau khi trả.</p>
      <div class="modal-actions">
        <button class="btn secondary" id="btn-no-laundry">Không</button>
        <button class="btn" id="btn-yes-laundry">Có — đánh dấu đang giặt</button>
      </div>
    `);
    document.getElementById('btn-no-laundry').addEventListener('click', ()=>{ closeModal(); onDone(); });
    document.getElementById('btn-yes-laundry').addEventListener('click', async ()=>{
      const btn = document.getElementById('btn-yes-laundry');
      btn.disabled = true;
      const itemIds = itemsNeedingLaundryCheck.map(oi=>oi.item_id);
      const {error: updErr} = await sb.from('items').update({manual_status:'giat'}).in('id', itemIds);
      if(updErr){ toastError(updErr); btn.disabled = false; return; }
      closeModal(); toast('Đã đánh dấu đang giặt'); onDone();
    });
  } else {
    closeModal();
    toast(msg);
    onDone();
  }
}

/* ---------- Flow: hoàn cọc (returned -> closed) ---------- */
function flowReturnDeposit(order, remaining, onDone){
  // Cảnh báo nếu đơn còn thiếu tiền thuê trước khi hoàn cọc (finding #16)
  const warnHtml = remaining > 0 ? `<p class="remain-warn">⚠️ Đơn còn thiếu ${money(remaining)}</p>` : '';
  const alreadyReturned = Number(order.deposit_returned_amount || 0);
  // Audit-batch-UX-1 #3: dùng CỌC CÒN GIỮ (deposit_amount − phần đã hoàn trước đó) thay vì
  // deposit_amount toàn phần — tránh đếm trùng khi mở lại đơn closed rồi hoàn cọc lần 2 (A5).
  const deposit = Number(order.deposit_amount) - alreadyReturned;

  if(deposit <= 0){
    openModal(`
      <h3>Hoàn cọc</h3>
      <p>Đơn <b>${order.code}</b> — Cọc đã hoàn đủ trước đó (${money(alreadyReturned)}${order.deposit_returned_at ? ' lúc '+formatDateTimeVN(order.deposit_returned_at) : ''}).</p>
      ${warnHtml}
      <div class="modal-actions"><button class="btn" id="btn-confirm-close-only">Đóng đơn</button></div>
    `);
    document.getElementById('btn-confirm-close-only').addEventListener('click', async ()=>{
      const btn = document.getElementById('btn-confirm-close-only');
      btn.disabled = true;
      const {error} = await sb.from('orders').update({status:'closed'}).eq('id', order.id);
      if(error){ toastError(error); btn.disabled = false; return; }
      closeModal(); toast('Đã đóng đơn'); onDone();
    });
    return;
  }

  // B2: mặc định hoàn = cọc còn giữ − còn thiếu (không âm) khi đơn còn thiếu tiền thuê; không thiếu thì hoàn đủ cọc còn giữ.
  function computeDefaultRefund(deduct){
    return (remaining > 0 && deduct) ? Math.max(deposit - remaining, 0) : deposit;
  }
  const deductCheckboxHtml = remaining > 0
    ? `<div class="field"><label><input type="checkbox" id="f-deduct-rent" checked> Trừ ${money(Math.min(remaining, deposit))} tiền thuê còn thiếu vào cọc</label></div>`
    : '';
  openModal(`
    <h3>Hoàn cọc</h3>
    <p>Đơn <b>${order.code}</b> — Cọc còn giữ: ${money(deposit)}</p>
    ${warnHtml}
    ${deductCheckboxHtml}
    <div class="field"><label>Số tiền hoàn</label><input type="text" inputmode="numeric" id="f-refund" value="${computeDefaultRefund(true).toLocaleString('vi-VN')}"></div>
    <div class="field"><label>Lý do (bắt buộc nếu giữ thêm tiền ngoài phần trừ nợ tiền thuê)</label><textarea id="f-refund-reason"></textarea></div>
    <div class="modal-actions"><button class="btn" id="btn-confirm-refund">Xác nhận hoàn cọc & đóng đơn</button></div>
  `);
  attachMoneyFormatting(document.getElementById('f-refund'));
  // Audit-batch-UX-1 #6: đổi trạng thái checkbox → recalc lại mặc định ô "Số tiền hoàn".
  document.getElementById('f-deduct-rent')?.addEventListener('change', (e)=>{
    document.getElementById('f-refund').value = computeDefaultRefund(e.target.checked).toLocaleString('vi-VN');
  });
  document.getElementById('btn-confirm-refund').addEventListener('click', async ()=>{
    const btn = document.getElementById('btn-confirm-refund');
    const refund = parseMoneyInput(document.getElementById('f-refund').value);
    const reason = document.getElementById('f-refund-reason').value.trim();
    const deductRentChecked = remaining > 0 && !!document.getElementById('f-deduct-rent')?.checked;
    if(refund > deposit){ toast('Không thể hoàn nhiều hơn cọc còn giữ'); return; }
    const diff = deposit - refund;
    // B2: phần trừ khỏi cọc còn giữ (diff) tách làm 2 — trước hết bù tiền thuê còn thiếu (ghi
    // tien_thue, tối đa = min(còn thiếu, diff)), phần dư ra (nếu có, do hư hỏng...) vẫn ghi tien_den như cũ.
    const deductedForRent = deductRentChecked ? Math.min(remaining, diff) : 0;
    const deductedForDamage = diff - deductedForRent;
    if(deductedForDamage > 0 && !reason){ toast('Nhập lý do khi giữ thêm tiền ngoài phần trừ nợ tiền thuê'); return; }
    btn.disabled = true;
    if(deductedForRent > 0){
      const {error:txErr1} = await sb.from('transactions').insert({
        type:'thu', category:'tien_thue', amount: deductedForRent, order_id: order.id,
        note: 'Trừ tiền thuê còn thiếu vào cọc'
      });
      if(txErr1){ toastError(txErr1); btn.disabled = false; return; }
    }
    if(deductedForDamage > 0){
      const {error:txErr2} = await sb.from('transactions').insert({
        type:'thu', category:'tien_den', amount: deductedForDamage, order_id: order.id,
        note: reason
      });
      if(txErr2){ toastError(txErr2); btn.disabled = false; return; }
    }
    // Audit-batch-UX-1 #3: CỘNG DỒN vào phần đã hoàn trước đó (không ghi đè) — đúng khi đây là
    // lần hoàn cọc thứ 2 trở lên sau khi mở lại đơn closed.
    const {error} = await sb.from('orders').update({
      deposit_returned_amount: alreadyReturned + refund,
      deposit_returned_at: new Date().toISOString(),
      status: 'closed'
    }).eq('id', order.id);
    if(error){ toastError(error); btn.disabled = false; return; }
    closeModal(); toast('Đã hoàn cọc, đơn hoàn tất'); onDone();
  });
}

/* ---------- Flow: hủy đơn (chỉ khi booked) ---------- */
function flowCancelOrder(order, onDone){
  if(isCashDeposit(order)){
    openModal(`
      <h3>Hủy đơn ${order.code}</h3>
      <p>Đơn có cọc tiền mặt ${money(order.deposit_amount)}. Hoàn lại cho khách bao nhiêu?</p>
      <div class="field"><label>Số tiền hoàn lại khách</label><input type="text" inputmode="numeric" id="f-cancel-refund" value="${Number(order.deposit_amount).toLocaleString('vi-VN')}"></div>
      <div class="field"><label>Lý do giữ cọc (bắt buộc nếu giữ lại một phần/toàn bộ)</label><textarea id="f-cancel-reason"></textarea></div>
      <p style="font-size:13px;color:var(--muted);">Phần tiệm giữ lại (khách bùng) sẽ tự tính = cọc − số hoàn, ghi nhận là "Phí hủy".</p>
      <div class="modal-actions"><button class="btn danger" id="btn-confirm-cancel">Xác nhận hủy đơn</button></div>
    `);
    attachMoneyFormatting(document.getElementById('f-cancel-refund'));
    document.getElementById('btn-confirm-cancel').addEventListener('click', async ()=>{
      const btn = document.getElementById('btn-confirm-cancel');
      // Ô trống coi là lỗi, không mặc định về 0 (finding #12)
      const refundRaw = document.getElementById('f-cancel-refund').value.trim();
      if(refundRaw === ''){ toast('Nhập số tiền hoàn (có thể nhập 0)'); return; }
      const refund = parseMoneyInput(refundRaw);
      const reason = document.getElementById('f-cancel-reason').value.trim();
      const deposit = Number(order.deposit_amount);
      if(refund > deposit){ toast('Không thể hoàn nhiều hơn tiền cọc'); return; }
      const kept = deposit - refund;
      if(kept > 0 && !reason){ toast('Nhập lý do giữ cọc'); return; }
      btn.disabled = true;
      if(kept > 0){
        const {error:txErr} = await sb.from('transactions').insert({
          type:'thu', category:'phi_huy', amount: kept, order_id: order.id, note: reason
        });
        if(txErr){ toastError(txErr); btn.disabled = false; return; }
      }
      const {error} = await sb.from('orders').update({
        status:'cancelled',
        deposit_returned_amount: refund,
        deposit_returned_at: new Date().toISOString()
      }).eq('id', order.id);
      if(error){ toastError(error); btn.disabled = false; return; }
      closeModal(); toast('Đã hủy đơn'); onDone();
    });
  } else {
    openModal(`
      <h3>Hủy đơn ${order.code}</h3>
      <p>Đơn không có cọc tiền mặt. Xác nhận hủy?</p>
      <div class="modal-actions"><button class="btn danger" id="btn-confirm-cancel2">Xác nhận hủy đơn</button></div>
    `);
    document.getElementById('btn-confirm-cancel2').addEventListener('click', async ()=>{
      const btn = document.getElementById('btn-confirm-cancel2');
      btn.disabled = true;
      const {error} = await sb.from('orders').update({status:'cancelled'}).eq('id', order.id);
      if(error){ toastError(error); btn.disabled = false; return; }
      closeModal(); toast('Đã hủy đơn'); onDone();
    });
  }
}

/* ---------- Sửa đơn ---------- */
async function openEditOrderModal(order, customer){
  const {data: existingOrderItems} = await sb.from('order_items').select('*, item:items(*)').eq('order_id', order.id);
  openModal(`
    <h3>Sửa đơn ${order.code}</h3>
    <form id="edit-order-form">
      <div class="field"><label>Tên khách</label><input type="text" id="e-name" value="${escapeHtml(customer?.name||'')}"></div>
      <div class="field"><label>Số điện thoại</label><input type="tel" id="e-phone" value="${escapeHtml(customer?.phone||'')}"></div>
      <div class="field"><label>Nhận lúc</label><input type="datetime-local" id="e-pickup" value="${isoToVnLocalInput(order.pickup_at)}"></div>
      <div class="field"><label>Trả lúc</label><input type="datetime-local" id="e-return" value="${isoToVnLocalInput(order.return_due_at)}"></div>
      ${itemPickerBlockHtml('e')}
      <div class="field"><label>Ghi chú món/đồ ngoài kho</label><textarea id="e-items">${escapeHtml(order.items_text||'')}</textarea></div>
      <div class="field"><label>Tiền thuê</label><input type="text" inputmode="numeric" id="e-price" value="${Number(order.rental_price).toLocaleString('vi-VN')}"><div class="amount-words" id="e-price-words"></div></div>
      <div class="field"><label>Tiền cọc</label><input type="text" inputmode="numeric" id="e-deposit" value="${Number(order.deposit_amount).toLocaleString('vi-VN')}"><div class="amount-words" id="e-deposit-words"></div></div>
      <div class="field">
        <label>Hình thức cọc</label>
        <select id="e-deposit-type">
          <option value="cash" ${order.deposit_type==='cash'?'selected':''}>Tiền mặt</option>
          <option value="cccd" ${order.deposit_type==='cccd'?'selected':''}>CCCD</option>
          <option value="cash_cccd" ${order.deposit_type==='cash_cccd'?'selected':''}>Tiền mặt + CCCD</option>
          <option value="none" ${order.deposit_type==='none'?'selected':''}>Không cọc</option>
        </select>
      </div>
      <div class="field"><label>Ghi chú</label><textarea id="e-note">${escapeHtml(order.note||'')}</textarea></div>
      <div class="modal-actions sticky-submit"><button type="submit" class="btn">Lưu thay đổi</button></div>
    </form>
  `);
  attachMoneyFormatting(document.getElementById('e-price'));
  attachMoneyFormatting(document.getElementById('e-deposit'));
  attachAmountInWords(document.getElementById('e-price'), document.getElementById('e-price-words'));
  attachAmountInWords(document.getElementById('e-deposit'), document.getElementById('e-deposit-words'));

  const itemPicker = wireItemPickerBlock({
    idPrefix:'e', pickupId:'e-pickup', returnId:'e-return',
    priceFieldId:'e-price', depositFieldId:'e-deposit',
    excludeOrderId: order.id,
    initialEntries: (existingOrderItems||[]).filter(oi=>oi.item).map(oi=>({item: oi.item, price: Number(oi.price), priceTouched:true, conflict:null})),
    saveBtnSelector:'#edit-order-form button[type=submit]'
  });
  // Đơn đang sửa đã có tiền thuê/cọc thật từ trước — không để việc tính lại gợi ý (chạy nền khi mở modal)
  // âm thầm ghi đè giá trị đã lưu; chỉ gợi ý khi người dùng chủ động đổi ngày/món sau đó.
  itemPicker.state.priceDirty = true;
  itemPicker.state.depositDirty = true;
  document.getElementById('e-pickup').addEventListener('change', ()=>itemPicker.recomputeAll());
  document.getElementById('e-return').addEventListener('change', ()=>itemPicker.recomputeAll());

  document.getElementById('edit-order-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    const pickupISO = vnLocalInputToISO(document.getElementById('e-pickup').value);
    const returnISO = vnLocalInputToISO(document.getElementById('e-return').value);
    if(new Date(returnISO) <= new Date(pickupISO)){ toast('Giờ trả phải sau giờ nhận'); return; }
    const price = parseMoneyInput(document.getElementById('e-price').value);
    const deposit = parseMoneyInput(document.getElementById('e-deposit').value);
    const items = document.getElementById('e-items').value.trim();

    // Chặn lưu nếu có món đang chọn bị trùng lịch/không khả dụng (excludeOrderId đã tự loại chính đơn này)
    itemPicker.recomputeAll();
    if(itemPicker.state.entries.some(e=>e.conflict)){ toast('Có món đang trùng lịch/không khả dụng, không thể lưu'); return; }

    btn.disabled = true;

    if(customer){
      // Bắt lỗi update customer thay vì âm thầm bỏ qua rồi vẫn báo "Đã lưu" (finding #11)
      const {error: custErr} = await sb.from('customers').update({
        name: document.getElementById('e-name').value.trim(),
        phone: document.getElementById('e-phone').value.trim() || null
      }).eq('id', customer.id);
      if(custErr){ toast('Lỗi cập nhật khách: '+viError(custErr), 4000); btn.disabled = false; return; }
    }
    const {error} = await sb.from('orders').update({
      items_text: items || null,
      pickup_at: pickupISO,
      return_due_at: returnISO,
      rental_price: price,
      deposit_amount: deposit,
      deposit_type: document.getElementById('e-deposit-type').value,
      note: document.getElementById('e-note').value.trim() || null
    }).eq('id', order.id);
    if(error){ toastError(error); btn.disabled = false; return; }

    // audit-phase2 #2: đồng bộ order_items bằng DIFF (chỉ xóa món bị bỏ, thêm món mới, cập nhật
    // giá món đổi) thay vì xóa hết rồi insert lại — bản cũ nếu insert lỗi giữa chừng thì mất SẠCH
    // snapshot món (kể cả những món không đổi) mà modal vẫn đóng, toast vẫn báo "Đã lưu" (SAI).
    // Đọc lại order_items MỚI NHẤT từ DB tại đây (không dùng existingOrderItems chụp lúc mở modal,
    // tránh tính diff trên dữ liệu cũ). Bất kỳ bước nào lỗi → GIỮ MODAL MỞ, giữ nguyên state đã
    // chọn, toast lỗi rõ ràng, KHÔNG closeModal, để người dùng có thể bấm Lưu lại ngay.
    const {data: freshOrderItems, error: fetchErr} = await sb.from('order_items').select('item_id, price').eq('order_id', order.id);
    if(fetchErr){ toast('Lỗi đọc dữ liệu món hiện tại, chưa lưu món — thử lại: '+viError(fetchErr), 4000); btn.disabled = false; return; }

    const existingMap = new Map((freshOrderItems||[]).map(oi=>[oi.item_id, oi]));
    const currentIds = new Set(itemPicker.state.entries.map(en=>en.item.id));
    const idsToDelete = [...existingMap.keys()].filter(id=>!currentIds.has(id));
    const entriesToInsert = itemPicker.state.entries.filter(en=>!existingMap.has(en.item.id));
    const entriesToUpdate = itemPicker.state.entries.filter(en=>{
      const ex = existingMap.get(en.item.id);
      return ex && Number(ex.price) !== Number(en.price||0);
    });

    if(idsToDelete.length){
      const {error: delErr} = await sb.from('order_items').delete().eq('order_id', order.id).in('item_id', idsToDelete);
      if(delErr){ toast('Lỗi đồng bộ món (xóa món bị bỏ): '+viError(delErr)+' — thông tin đơn đã lưu, bấm Lưu lại để thử đồng bộ món.', 4000); btn.disabled = false; return; }
    }
    if(entriesToInsert.length){
      const rows = entriesToInsert.map(en=>({order_id:order.id, item_id:en.item.id, price:Number(en.price||0)}));
      const {error: insErr} = await sb.from('order_items').insert(rows);
      if(insErr){ toast('Lỗi đồng bộ món (thêm món mới): '+viError(insErr)+' — thông tin đơn đã lưu, bấm Lưu lại để thử đồng bộ món.', 4000); btn.disabled = false; return; }
    }
    for(const en of entriesToUpdate){
      const {error: updErr} = await sb.from('order_items').update({price:Number(en.price||0)}).eq('order_id', order.id).eq('item_id', en.item.id);
      if(updErr){ toast('Lỗi đồng bộ món (cập nhật giá): '+viError(updErr)+' — thông tin đơn đã lưu, bấm Lưu lại để thử đồng bộ món.', 4000); btn.disabled = false; return; }
    }

    closeModal(); toast('Đã lưu');
    if(currentTab==='orders') renderOrders(); else renderToday();
  });
}

/* ============================================================
   TAB PHASE 2: KHO
   ============================================================ */
let khoSearchTerm = '';
let khoFilterCategory = 'all';
let khoFilterStatus = 'all';
let khoDateStr = vnDateStr();

async function renderKho(){
  const el = document.getElementById('tab-content');
  el.innerHTML = '<div class="loading">Đang tải...</div>';

  const [itemsRes, ordersRes, orderItemsRes] = await Promise.all([
    sb.from('items').select('*').order('created_at',{ascending:false}),
    sb.from('orders').select('id,code,status,pickup_at,return_due_at'),
    sb.from('order_items').select('order_id,item_id')
  ]);
  if(itemsRes.error || ordersRes.error || orderItemsRes.error){
    el.innerHTML = `<div class="error-block">Không tải được dữ liệu — kiểm tra mạng rồi bấm Tải lại.<br><button class="btn" id="btn-kho-retry">Tải lại</button></div>`;
    document.getElementById('btn-kho-retry').addEventListener('click', renderKho);
    return;
  }
  const items = itemsRes.data || [];
  const orders = ordersRes.data || [];
  const orderItems = orderItemsRes.data || [];

  let html = `<div class="fab-row"><button class="btn" id="btn-add-item">+ Thêm món</button></div>`;
  html += `<div class="field"><label>Còn trống ngày</label><input type="date" id="kho-date" value="${khoDateStr}"></div>`;
  html += `<div class="filter-row"><input type="text" id="kho-search" placeholder="Tìm tên / mã / size" value="${escapeHtml(khoSearchTerm)}"></div>`;
  html += `<div class="chips" id="kho-cat-chips">
    <button type="button" class="chip ${khoFilterCategory==='all'?'active':''}" data-cat="all">Tất cả loại</button>
    ${Object.keys(CATEGORY_LABEL).map(c=>`<button type="button" class="chip ${khoFilterCategory===c?'active':''}" data-cat="${c}">${CATEGORY_LABEL[c]}</button>`).join('')}
  </div>`;
  html += `<div class="chips" id="kho-status-chips">
    <button type="button" class="chip ${khoFilterStatus==='all'?'active':''}" data-status="all">Tất cả trạng thái</button>
    <button type="button" class="chip ${khoFilterStatus==='green'?'active':''}" data-status="green">🟢 Sẵn sàng</button>
    <button type="button" class="chip ${khoFilterStatus==='yellow'?'active':''}" data-status="yellow">🟡 Đã đặt</button>
    <button type="button" class="chip ${khoFilterStatus==='red'?'active':''}" data-status="red">🔴 Đang thuê</button>
    <button type="button" class="chip ${khoFilterStatus==='gray'?'active':''}" data-status="gray">⚪ Giặt/sửa/hỏng/nghỉ</button>
  </div>`;
  html += `<div id="kho-grid"></div>`;
  el.innerHTML = html;

  document.getElementById('btn-add-item').addEventListener('click', ()=>openAddItemModal());
  document.getElementById('kho-date').addEventListener('change', (e)=>{
    khoDateStr = e.target.value || vnDateStr();
    paintItemGrid(items, orders, orderItems);
  });
  document.getElementById('kho-search').addEventListener('input', (e)=>{
    khoSearchTerm = e.target.value;
    paintItemGrid(items, orders, orderItems);
  });
  el.querySelectorAll('#kho-cat-chips .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      khoFilterCategory = chip.dataset.cat;
      el.querySelectorAll('#kho-cat-chips .chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      paintItemGrid(items, orders, orderItems);
    });
  });
  el.querySelectorAll('#kho-status-chips .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      khoFilterStatus = chip.dataset.status;
      el.querySelectorAll('#kho-status-chips .chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      paintItemGrid(items, orders, orderItems);
    });
  });

  paintItemGrid(items, orders, orderItems);
}

function paintItemGrid(items, orders, orderItems){
  const gridEl = document.getElementById('kho-grid');
  const dateStr = khoDateStr || vnDateStr();
  const term = khoSearchTerm.trim().toLowerCase();
  const filtered = items.filter(it=>{
    if(khoFilterCategory!=='all' && it.category!==khoFilterCategory) return false;
    const status = computeItemStatusForDate(it, orders, orderItems, dateStr);
    if(khoFilterStatus!=='all' && status.color!==khoFilterStatus) return false;
    if(term){
      const hay = `${it.name} ${it.code} ${it.size||''}`.toLowerCase();
      if(!hay.includes(term)) return false;
    }
    return true;
  });
  if(!filtered.length){
    // C2: tách "kho rỗng thật" khỏi "tìm/lọc không ra"
    const isFilteredEmpty = term || khoFilterCategory!=='all' || khoFilterStatus!=='all';
    gridEl.innerHTML = isFilteredEmpty
      ? `<div class="empty-state">${term ? `Không tìm thấy '${escapeHtml(khoSearchTerm.trim())}'` : 'Không có món nào khớp bộ lọc'}</div>`
      : `<div class="empty-state">Kho đang trống — bấm [+ Thêm món] để bắt đầu</div>`;
    return;
  }
  gridEl.innerHTML = `<div class="item-grid">` + filtered.map(it=>{
    const status = computeItemStatusForDate(it, orders, orderItems, dateStr);
    const thumb = it.photo_url ? `<img src="${escapeHtml(it.photo_url)}" alt="" loading="lazy">` : (CATEGORY_EMOJI[it.category]||'📦');
    const availLine = status.nextAvailableUnknown
      ? `<div class="item-avail">Chưa rõ ngày có lại (khách chưa trả đồ)</div>`
      : (status.nextAvailableMs ? `<div class="item-avail">Có lại: ${formatShortDateVN(new Date(status.nextAvailableMs).toISOString())}</div>` : '');
    return `<button type="button" class="item-card" data-item-id="${it.id}">
      <div class="thumb">${thumb}</div>
      <div class="info">
        <div class="name"><span class="status-dot ${status.color}"></span>${escapeHtml(it.name)}</div>
        <div class="meta">${it.code}${it.size?(' · '+escapeHtml(it.size)):''}</div>
        <div class="status-label ${status.color}">${escapeHtml(status.label)}</div>
        ${availLine}
      </div>
    </button>`;
  }).join('') + `</div>`;
  gridEl.querySelectorAll('[data-item-id]').forEach(b=>b.addEventListener('click',()=>openItemDetail(b.dataset.itemId)));
}

/* ---------- Thêm / sửa món ---------- */

  return `
    <div class="field"><label>Tên món *</label><input type="text" id="${idPrefix}-name" value="${escapeHtml(item.name||'')}" required></div>

      <label>Loại *</label>
      <select id="${idPrefix}-category">
        ${Object.keys(CATEGORY_LABEL).map(c=>`<option value="${c}" ${cat===c?'selected':''}>${CATEGORY_LABEL[c]}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Size</label><input type="text" id="${idPrefix}-size" value="${escapeHtml(item.size||'')}" placeholder="S/M/L/38/40/freesize..."></div>
    <div class="field"><label>Ảnh (không bắt buộc)</label><input type="file" accept="image/*" capture="environment" id="${idPrefix}-photo"></div>
    <div class="field"><label>Giá thuê / ngày</label><input type="text" inputmode="numeric" id="${idPrefix}-price-day" value="${item.rent_price_day?Number(item.rent_price_day).toLocaleString('vi-VN'):''}"></div>
    <div class="field"><label>Giá thuê / giờ (nếu cho thuê theo giờ)</label><input type="text" inputmode="numeric" id="${idPrefix}-price-hour" value="${item.rent_price_hour?Number(item.rent_price_hour).toLocaleString('vi-VN'):''}"></div>
    <div class="field"><label>Cọc gợi ý</label><input type="text" inputmode="numeric" id="${idPrefix}-deposit" value="${item.deposit_value?Number(item.deposit_value).toLocaleString('vi-VN'):''}"></div>
    <div class="field"><label>Giá đền (nếu làm hỏng)</label><input type="text" inputmode="numeric" id="${idPrefix}-replace" value="${item.replace_value?Number(item.replace_value).toLocaleString('vi-VN'):''}"></div>
    <div class="field"><label>Giá vốn</label><input type="text" inputmode="numeric" id="${idPrefix}-cost" value="${item.cost_price?Number(item.cost_price).toLocaleString('vi-VN'):''}"></div>
    <div class="field"><label>Nghỉ giặt sau khi trả (giờ)</label><input type="text" inputmode="numeric" id="${idPrefix}-buffer" value="${item.buffer_hours!=null?item.buffer_hours:DEFAULT_BUFFER_BY_CATEGORY[cat]}"></div>

function openAddItemModal(onCreated){
  openModal(`
    <h3>Thêm món</h3>
    <form id="item-form">
      ${itemFormFieldsHtml(null, 'i')}
      <div class="modal-actions sticky-submit"><button type="submit" class="btn">Lưu món</button></div>
    </form>
  `);
  wireItemForm('i', null, onCreated);
}

function openEditItemModal(item){
  openModal(`
    <h3>Sửa món ${item.code}</h3>
    <form id="item-form">
      ${itemFormFieldsHtml(item, 'i')}
      <div class="modal-actions sticky-submit"><button type="submit" class="btn">Lưu thay đổi</button></div>
    </form>
  `);
  wireItemForm('i', item, ()=>openItemDetail(item.id));
}

function wireItemForm(idPrefix, existingItem, onDone){
  attachMoneyFormatting(document.getElementById(`${idPrefix}-price-day`));
  attachMoneyFormatting(document.getElementById(`${idPrefix}-price-hour`));
  attachMoneyFormatting(document.getElementById(`${idPrefix}-deposit`));
  attachMoneyFormatting(document.getElementById(`${idPrefix}-replace`));
  attachMoneyFormatting(document.getElementById(`${idPrefix}-cost`));
  const catSelect = document.getElementById(`${idPrefix}-category`);
  const bufferInput = document.getElementById(`${idPrefix}-buffer`);
  let bufferTouched = !!existingItem;
  bufferInput.addEventListener('input', ()=>{ bufferTouched = true; });
  catSelect.addEventListener('change', ()=>{
    if(!bufferTouched) bufferInput.value = DEFAULT_BUFFER_BY_CATEGORY[catSelect.value];
  });

  document.getElementById('item-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    const name = document.getElementById(`${idPrefix}-name`).value.trim();
    if(!name){ toast('Nhập tên món'); return; }
    const payload = {
      name,
      category: catSelect.value,
      size: document.getElementById(`${idPrefix}-size`).value.trim() || null,
      rent_price_day: parseMoneyInput(document.getElementById(`${idPrefix}-price-day`).value),
      rent_price_hour: parseMoneyInput(document.getElementById(`${idPrefix}-price-hour`).value),
      deposit_value: parseMoneyInput(document.getElementById(`${idPrefix}-deposit`).value),
      replace_value: parseMoneyInput(document.getElementById(`${idPrefix}-replace`).value),
      cost_price: parseMoneyInput(document.getElementById(`${idPrefix}-cost`).value),
      // audit-phase2 #4: chặn buffer âm lọt qua client (parseInt('-5')||0 = -5, vẫn "truthy" nên
      // lọt qua || 0) — ép về tối thiểu 0. Migration đi kèm thêm CHECK constraint ở DB.
      buffer_hours: Math.max(0, parseInt(document.getElementById(`${idPrefix}-buffer`).value, 10) || 0),
      note: document.getElementById(`${idPrefix}-note`).value.trim() || null
    };
    btn.disabled = true;
    const photoFile = document.getElementById(`${idPrefix}-photo`).files[0] || null;

    let itemId = existingItem ? existingItem.id : null;
    if(existingItem){
      const {error} = await sb.from('items').update(payload).eq('id', existingItem.id);
      if(error){ toastError(error); btn.disabled = false; return; }
    } else {
      const {data, error} = await sb.from('items').insert(payload).select().single();
      if(error){ toast('Lỗi tạo món: '+viError(error), 4000); btn.disabled = false; return; }
      itemId = data.id;
    }

    if(photoFile){
      try{
        const resized = await resizeImageFile(photoFile, 800);
        const url = await uploadItemPhoto(itemId, resized);
        const {error: photoErr} = await sb.from('items').update({photo_url:url}).eq('id', itemId);
        if(photoErr){ toast('Lưu món OK nhưng lỗi ảnh: '+viError(photoErr), 4000); }
      }catch(photoEx){
        toast('Lưu món OK nhưng lỗi xử lý ảnh: '+viError(photoEx), 4000);
      }
    }

    closeModal(); toast('Đã lưu món');
    if(onDone) onDone(itemId);
    else if(currentTab==='kho') renderKho();
  });
}

/* ---------- Chi tiết món ---------- */
async function openItemDetail(itemId){
  const {data: item} = await sb.from('items').select('*').eq('id', itemId).single();
  if(!item){ toast('Không tìm thấy món'); return; }
  const {data: oiRows} = await sb.from('order_items').select('*, orders(id,code,status,pickup_at,return_due_at)').eq('item_id', itemId);
  const rows = oiRows || [];

  // audit-phase2 #13: chỉ tính đơn đã THỰC SỰ diễn ra (đã giao đồ trở đi) vào lượt thuê/doanh thu —
  // đơn 'booked' chưa diễn ra (có thể còn bị hủy) không được tính vào thống kê hoàn vốn.
  const activeRows = rows.filter(r=>r.orders && ['picked_up','returned','closed'].includes(r.orders.status));
  const rentalCount = activeRows.length;
  const revenue = activeRows.reduce((s,r)=>s+Number(r.price),0);
  const costPrice = Number(item.cost_price||0);
  const roiHtml = costPrice > 0
    ? (revenue >= costPrice ? `Đã hoàn vốn ✅ (dư ${money(revenue-costPrice)})` : `Còn ${money(costPrice-revenue)} nữa hoàn vốn`)
    : `Chưa nhập giá vốn`;

  const nowMs = Date.now();
  const ordersForBusy = [];
  const seenOrderIds = new Set();
  rows.forEach(r=>{
    if(r.orders && !seenOrderIds.has(r.orders.id)){ seenOrderIds.add(r.orders.id); ordersForBusy.push(r.orders); }
  });
  const orderItemsForBusy = rows.map(r=>({order_id: r.order_id, item_id: itemId}));
  const busy = itemBusyIntervals(item, ordersForBusy, orderItemsForBusy, nowMs);
  // A2: bỏ trần 14 ngày — hiện TẤT CẢ khoảng bận tương lai (sort tăng dần), cap HIỂN THỊ ở 20 dòng đầu.
  const allUpcomingBusy = busy.filter(iv=>iv.endMs > nowMs).sort((a,b)=>a.startMs-b.startMs);
  const upcomingBusy = allUpcomingBusy.slice(0, 20);
  const extraBusyCount = allUpcomingBusy.length - upcomingBusy.length;

  const photoHtml = item.photo_url ? `<img src="${escapeHtml(item.photo_url)}" alt="">` : (CATEGORY_EMOJI[item.category]||'📦');
  const canDelete = rows.length === 0;

  openModal(`
    <h3>${item.code} — ${escapeHtml(item.name)}</h3>
    <div class="item-photo-lg">${photoHtml}</div>
    <div class="kv"><span class="k">Loại</span><span class="v">${CATEGORY_LABEL[item.category]||item.category}</span></div>
    <div class="kv"><span class="k">Size</span><span class="v">${escapeHtml(item.size||'—')}</span></div>
    <div class="kv"><span class="k">Giá thuê/ngày</span><span class="v">${money(item.rent_price_day)}</span></div>
    <div class="kv"><span class="k">Giá thuê/giờ</span><span class="v">${item.rent_price_hour>0?money(item.rent_price_hour):'—'}</span></div>
    <div class="kv"><span class="k">Cọc gợi ý</span><span class="v">${money(item.deposit_value)}</span></div>
    <div class="kv"><span class="k">Giá đền</span><span class="v">${money(item.replace_value)}</span></div>
    <div class="kv"><span class="k">Giá vốn</span><span class="v">${money(item.cost_price)}</span></div>
    <div class="kv"><span class="k">Nghỉ giặt sau khi trả</span><span class="v">${item.buffer_hours} giờ</span></div>
    ${item.note ? `<div class="kv"><span class="k">Ghi chú</span><span class="v">${escapeHtml(item.note)}</span></div>` : ''}

    <div class="section-title">Đánh dấu tình trạng</div>
    <div class="manual-status-chips" id="manual-status-chips">
      ${Object.keys(MANUAL_STATUS_LABEL).map(s=>`<button type="button" class="chip ${item.manual_status===s?'active':''}" data-status="${s}">${MANUAL_STATUS_LABEL[s]}</button>`).join('')}
    </div>

    <div class="section-title">Lịch bận sắp tới</div>
    ${upcomingBusy.length ? upcomingBusy.map(iv=>`
      <div class="busy-row" data-order-id="${iv.orderId}">
        <span>${iv.orderCode}</span>
        <span>${formatDateTimeVN(new Date(iv.startMs).toISOString())} → ${iv.endMs===Infinity?'chưa rõ (chưa trả đồ)':formatDateTimeVN(new Date(iv.endMs).toISOString())}</span>
      </div>`).join('') : `<div class="empty-state">Không có lịch bận sắp tới</div>`}
    ${extraBusyCount > 0 ? `<div class="empty-state">... còn ${extraBusyCount} khoảng nữa</div>` : ''}

    <div class="section-title">Thống kê</div>
    <div class="kv"><span class="k">Số lượt thuê</span><span class="v">${rentalCount}</span></div>
    <div class="kv"><span class="k">Món này đã thu về</span><span class="v">${money(revenue)}</span></div>
    <div class="kv"><span class="k">Hoàn vốn</span><span class="v">${roiHtml}</span></div>

    <div class="modal-actions" style="flex-wrap:wrap;">
      <button class="btn secondary block-sm" id="btn-edit-item">Sửa món</button>
      ${canDelete ? `<button class="btn danger block-sm" id="btn-delete-item">Xóa món</button>` : ''}
    </div>
  `);

  document.querySelectorAll('#manual-status-chips .chip').forEach(chip=>{
    chip.addEventListener('click', async ()=>{
      const {error} = await sb.from('items').update({manual_status: chip.dataset.status}).eq('id', itemId);
      if(error){ toastError(error); return; }
      toast('Đã cập nhật trạng thái');
      openItemDetail(itemId);
    });
  });
  document.querySelectorAll('.busy-row[data-order-id]').forEach(row=>{
    row.addEventListener('click', ()=>openOrderDetail(row.dataset.orderId));
  });
  document.getElementById('btn-edit-item').addEventListener('click', ()=>openEditItemModal(item));
  document.getElementById('btn-delete-item')?.addEventListener('click', async ()=>{
    if(!confirm(`Xóa món ${item.code}? Không thể hoàn tác.`)) return;
    const btn = document.getElementById('btn-delete-item');
    btn.disabled = true;
    const {error} = await sb.from('items').delete().eq('id', itemId);
    if(error){ toast('Lỗi xóa (có thể đã có lịch sử): '+viError(error), 4000); btn.disabled = false; return; }
    // audit-phase2 #10: xóa món xong thì dọn luôn ảnh trong bucket (tên file cố định {item_id}.jpg)
    // — không chặn việc báo "đã xóa" nếu lỡ lỗi xóa ảnh (món đã xóa khỏi DB rồi, không hoàn tác được).
    if(item.photo_url){
      const {error: rmErr} = await sb.storage.from('item-photos').remove([`${itemId}.jpg`]);
      if(rmErr){ toast('Đã xóa món (ảnh trong kho lưu trữ có thể chưa xóa hết: '+viError(rmErr)+')'); closeModal(); if(currentTab==='kho') renderKho(); return; }
    }
    closeModal(); toast('Đã xóa món');
    if(currentTab==='kho') renderKho();
  });
}

/* ============================================================
   TAB 3: THU CHI
   ============================================================ */
let cashflowMonth = currentVnYearMonth();
let cashflowType = 'all';
let cashflowCategory = 'all';
let cashflowDateScope = 'month'; // 'today' | 'month' — B1(b)

async function renderCashflow(){
  const el = document.getElementById('tab-content');
  el.innerHTML = '<div class="loading">Đang tải...</div>';

  let html = `<div class="fab-row">
    <button class="btn thu" id="btn-add-thu">+ Thu</button>

    <button type="button" class="chip ${cashflowDateScope==='today'?'active':''}" data-scope="today">Hôm nay</button>
    <button type="button" class="chip ${cashflowDateScope==='month'?'active':''}" data-scope="month">Cả tháng</button>
  </div>`;
  html += `<div class="filter-row">
    ${monthPickerHtml('cf-month', cashflowMonth)}
    <select id="cf-type">
      <option value="all">Tất cả loại</option>
      <option value="thu">Thu</option>

  </div>`;
  html += `<div id="cf-list"></div>`;
  el.innerHTML = html;

  document.getElementById('btn-add-thu').addEventListener('click', ()=>openTxModal('thu'));
  document.getElementById('btn-add-chi').addEventListener('click', ()=>openTxModal('chi'));
  el.querySelectorAll('#cf-scope-chips .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      cashflowDateScope = chip.dataset.scope;
      el.querySelectorAll('#cf-scope-chips .chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      loadCashflowList();
    });
  });
  document.getElementById('cf-month-month').addEventListener('change',()=>{cashflowMonth=monthPickerValue('cf-month'); loadCashflowList();});
  document.getElementById('cf-month-year').addEventListener('change',()=>{cashflowMonth=monthPickerValue('cf-month'); loadCashflowList();});
  document.getElementById('cf-type').value = cashflowType;
  document.getElementById('cf-type').addEventListener('change',(e)=>{cashflowType=e.target.value; refreshCategoryOptions(); loadCashflowList();});

  refreshCategoryOptions();
  document.getElementById('cf-category').addEventListener('change',(e)=>{cashflowCategory=e.target.value; loadCashflowList();});

  await loadCashflowList();
}
function refreshCategoryOptions(){
  const sel = document.getElementById('cf-category');
  let opts = [['all','Tất cả danh mục']];
  if(cashflowType==='thu') opts = opts.concat(CATS_THU);
  else if(cashflowType==='chi') opts = opts.concat(CATS_CHI);
  else opts = opts.concat(CATS_THU).concat(CATS_CHI);
  sel.innerHTML = opts.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  sel.value = cashflowCategory && opts.some(o=>o[0]===cashflowCategory) ? cashflowCategory : 'all';
  cashflowCategory = sel.value;
}
async function loadCashflowList(){
  const listEl = document.getElementById('cf-list');
  listEl.innerHTML = '<div class="loading">Đang tải...</div>';
  const {startISO, endISO} = cashflowDateScope==='today' ? vnDayRange(vnDateStr()) : vnMonthRange(cashflowMonth);
  let q = sb.from('transactions').select('*').gte('occurred_at',startISO).lt('occurred_at',endISO).order('occurred_at',{ascending:false});
  if(cashflowType!=='all') q = q.eq('type', cashflowType);
  if(cashflowCategory!=='all') q = q.eq('category', cashflowCategory);
  const {data:tx, error} = await q;
  if(error){
    listEl.innerHTML = `<div class="error-block">Không tải được dữ liệu — kiểm tra mạng rồi bấm Tải lại.<br><button class="btn" id="btn-cf-retry">Tải lại</button></div>`;
    document.getElementById('btn-cf-retry').addEventListener('click', loadCashflowList);
    return;
  }
  const list = tx || [];
  if(!list.length){ listEl.innerHTML = `<div class="empty-state">Không có giao dịch</div>`; return; }

  const groups = {};
  list.forEach(t=>{
    const day = formatDateVN(t.occurred_at);
    (groups[day] = groups[day]||[]).push(t);
  });
  let html = '';
  Object.keys(groups).forEach(day=>{
    html += `<div class="tx-day-group"><div class="tx-day-label">${day}</div>`;
    groups[day].forEach(t=>{
      html += `<div class="tx-row" data-tx-id="${t.id}">
        <div><div>${CAT_LABEL[t.category]||t.category}</div><div class="cat">${t.note?escapeHtml(t.note):''}</div></div>
        <div class="amt ${t.type}">${t.type==='thu'?'+':'-'}${money(t.amount)}</div>
      </div>`;
    });
    html += `</div>`;
  });
  listEl.innerHTML = html;
  listEl.querySelectorAll('.tx-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const t = list.find(x=>x.id===row.dataset.txId);
      openTxEditModal(t);
    });
  });
}

function openTxModal(type){
  const cats = type==='thu' ? CATS_THU : CATS_CHI;
  openModal(`
    <h3>${type==='thu'?'Thêm khoản thu':'Thêm khoản chi'}</h3>
    <form id="tx-form">
      <div class="field"><label>Số tiền</label><input type="text" inputmode="numeric" id="tx-amount" required autofocus><div class="amount-words" id="tx-amount-words"></div></div>
      <div class="field">
        <label>Danh mục</label>
        <div class="chips" id="tx-chips">
          ${cats.map(c=>`<button type="button" class="chip" data-cat="${c[0]}">${c[1]}</button>`).join('')}
        </div>
      </div>
      <div class="field"><label>Ngày giờ</label><input type="datetime-local" id="tx-occurred" value="${isoToVnLocalInput(new Date().toISOString())}"></div>
      <div class="field"><label>Ghi chú</label><textarea id="tx-note"></textarea></div>
      <div class="modal-actions sticky-submit">
        <button type="button" class="btn secondary" id="btn-tx-save-again">Lưu & ghi tiếp</button>
        <button type="submit" class="btn ${type}">Lưu</button>
      </div>
    </form>
  `);
  attachMoneyFormatting(document.getElementById('tx-amount'));
  attachAmountInWords(document.getElementById('tx-amount'), document.getElementById('tx-amount-words'));
  // B4: KHÔNG chọn sẵn chip danh mục nào — chưa chọn thì không cho lưu (tránh ghi nhầm âm thầm).
  let selectedCat = null;
  document.querySelectorAll('#tx-chips .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('#tx-chips .chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      selectedCat = chip.dataset.cat;
    });
  });

  async function saveTx(){
    if(!selectedCat){ toast('Chọn khoản gì đã'); return false; }
    const amount = parseMoneyInput(document.getElementById('tx-amount').value);
    if(amount<=0){ toast('Nhập số tiền hợp lệ'); return false; }
    const note = document.getElementById('tx-note').value.trim();
    const occurredVal = document.getElementById('tx-occurred').value;
    const occurredISO = occurredVal ? vnLocalInputToISO(occurredVal) : new Date().toISOString();
    const {error} = await sb.from('transactions').insert({type, category:selectedCat, amount, note: note || null, occurred_at: occurredISO});
    if(error){ toastError(error); return false; }
    return true;
  }

  document.getElementById('tx-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true;
    const ok = await saveTx();
    if(!ok){ btn.disabled = false; return; }
    closeModal(); toast('Đã lưu giao dịch');
    if(currentTab==='cashflow') loadCashflowList();
    else if(currentTab==='today') renderToday();
  });

  // B4: "Lưu & ghi tiếp" — lưu xong giữ modal mở, xóa ô tiền + ghi chú, giữ loại thu/chi,
  // bỏ chọn chip (bắt chọn lại danh mục cho khoản tiếp theo), focus ô tiền.
  document.getElementById('btn-tx-save-again').addEventListener('click', async ()=>{
    const btn = document.getElementById('btn-tx-save-again');
    btn.disabled = true;
    const ok = await saveTx();
    btn.disabled = false;
    if(!ok) return;
    document.getElementById('tx-amount').value = '';
    document.getElementById('tx-note').value = '';
    document.querySelectorAll('#tx-chips .chip').forEach(c=>c.classList.remove('active'));
    selectedCat = null;
    document.getElementById('tx-amount').focus();
    toast('Đã ghi ✓');
    if(currentTab==='cashflow') loadCashflowList();
    else if(currentTab==='today') renderToday();
  });
}

function openTxEditModal(t){
  const cats = t.type==='thu' ? CATS_THU : CATS_CHI;
  openModal(`
    <h3>Sửa giao dịch</h3>
    <form id="tx-edit-form">
      <div class="field"><label>Số tiền</label><input type="text" inputmode="numeric" id="tx-e-amount" value="${Number(t.amount).toLocaleString('vi-VN')}"><div class="amount-words" id="tx-e-amount-words"></div></div>
      <div class="field">
        <label>Danh mục</label>
        <div class="chips" id="tx-e-chips">
          ${cats.map(c=>`<button type="button" class="chip ${c[0]===t.category?'active':''}" data-cat="${c[0]}">${c[1]}</button>`).join('')}
        </div>
      </div>
      <div class="field"><label>Ngày giờ</label><input type="datetime-local" id="tx-e-occurred" value="${isoToVnLocalInput(t.occurred_at)}"></div>
      <div class="field"><label>Ghi chú</label><textarea id="tx-e-note">${escapeHtml(t.note||'')}</textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn danger" id="tx-delete-btn">Xóa</button>
        <button type="submit" class="btn">Lưu</button>
      </div>
    </form>
  `);
  attachMoneyFormatting(document.getElementById('tx-e-amount'));
  attachAmountInWords(document.getElementById('tx-e-amount'), document.getElementById('tx-e-amount-words'));
  let selectedCat = t.category;
  document.querySelectorAll('#tx-e-chips .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('#tx-e-chips .chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      selectedCat = chip.dataset.cat;
    });
  });
  document.getElementById('tx-delete-btn').addEventListener('click', async ()=>{
    // Xác nhận trước khi xóa (finding #3)
    if(!confirm('Xóa giao dịch này?')) return;
    const btn = document.getElementById('tx-delete-btn');
    btn.disabled = true;
    const {error} = await sb.from('transactions').delete().eq('id', t.id);
    if(error){ toastError(error); btn.disabled = false; return; }
    closeModal(); toast('Đã xóa');
    if(currentTab==='cashflow') loadCashflowList();
  });
  document.getElementById('tx-edit-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    const amount = parseMoneyInput(document.getElementById('tx-e-amount').value);
    if(amount<=0){ toast('Nhập số tiền hợp lệ'); return; }
    const note = document.getElementById('tx-e-note').value.trim();
    const occurredVal = document.getElementById('tx-e-occurred').value;
    const occurredISO = occurredVal ? vnLocalInputToISO(occurredVal) : t.occurred_at;
    btn.disabled = true;
    const {error} = await sb.from('transactions').update({amount, category:selectedCat, note: note||null, occurred_at: occurredISO}).eq('id', t.id);
    if(error){ toastError(error); btn.disabled = false; return; }
    closeModal(); toast('Đã lưu');
    if(currentTab==='cashflow') loadCashflowList();
  });
}

/* ============================================================
   TAB 4: BÁO CÁO
   ============================================================ */
let reportMonth = currentVnYearMonth();

async function renderReport(){
  const el = document.getElementById('tab-content');
  el.innerHTML = '<div class="loading">Đang tải...</div>';
  let html = `<div class="filter-row">${monthPickerHtml('rp-month', reportMonth)}</div>`;
  html += `<div id="rp-body"></div>`;
  el.innerHTML = html;
  document.getElementById('rp-month-month').addEventListener('change',()=>{reportMonth=monthPickerValue('rp-month'); loadReport();});
  document.getElementById('rp-month-year').addEventListener('change',()=>{reportMonth=monthPickerValue('rp-month'); loadReport();});
  await loadReport();
}

async function loadReport(){
  const body = document.getElementById('rp-body');
  body.innerHTML = '<div class="loading">Đang tải...</div>';
  const {startISO, endISO} = vnMonthRange(reportMonth);
  const [txRes, ordersRes, orderItemsRes] = await Promise.all([
    sb.from('transactions').select('*').gte('occurred_at',startISO).lt('occurred_at',endISO),
    sb.from('orders').select('id,deposit_amount,deposit_returned_amount,deposit_type,status'),
    sb.from('order_items').select('item_id, price, order:orders(pickup_at,status), item:items(name)')
  ]);
  if(txRes.error || ordersRes.error || orderItemsRes.error){
    body.innerHTML = `<div class="error-block">Không tải được dữ liệu — kiểm tra mạng rồi bấm Tải lại.<br><button class="btn" id="btn-report-retry">Tải lại</button></div>`;
    document.getElementById('btn-report-retry').addEventListener('click', loadReport);
    return;
  }
  const tx = txRes.data || [];
  const orders = ordersRes.data || [];

  // Theo món: doanh thu = tổng price snapshot của order_items (không dùng giá live của món),
  // chỉ tính đơn có pickup_at trong tháng đang xem và status khác 'cancelled' (mục 3 todo-phase2.md).
  const startMs = new Date(startISO).getTime();
  const endMs = new Date(endISO).getTime();
  const itemRevenue = {};
  (orderItemsRes.data||[]).forEach(oi=>{
    if(!oi.item || !oi.order) return;
    if(oi.order.status === 'cancelled') return;
    const pMs = new Date(oi.order.pickup_at).getTime();
    if(pMs < startMs || pMs >= endMs) return;
    const key = oi.item_id;
    if(!itemRevenue[key]) itemRevenue[key] = {name: oi.item.name, count:0, revenue:0};
    itemRevenue[key].count += 1;
    itemRevenue[key].revenue += Number(oi.price||0);
  });
  const topItems = Object.values(itemRevenue).sort((a,b)=>b.revenue-a.revenue);

  const totalThu = tx.filter(t=>t.type==='thu').reduce((s,t)=>s+Number(t.amount),0);
  const totalChi = tx.filter(t=>t.type==='chi').reduce((s,t)=>s+Number(t.amount),0);
  const laiLo = totalThu - totalChi;
  const cocGiu = orders.reduce((s,o)=>s+depositHeld(o),0);

  const breakdown = {};
  tx.forEach(t=>{
    const key = t.type+'|'+t.category;
    breakdown[key] = (breakdown[key]||0) + Number(t.amount);
  });
  const thuRows = CATS_THU.filter(c=>breakdown['thu|'+c[0]]).map(c=>[c[1], breakdown['thu|'+c[0]]]);
  const chiRows = CATS_CHI.filter(c=>breakdown['chi|'+c[0]]).map(c=>[c[1], breakdown['chi|'+c[0]]]);

  body.innerHTML = `
    <div class="summary-row">
      <div class="summary-item"><div class="lbl">Tổng thu</div><div class="val">${money(totalThu)}</div></div>
      <div class="summary-item"><div class="lbl">Tổng chi</div><div class="val">${money(totalChi)}</div></div>
      <div class="summary-item"><div class="lbl">Lãi/lỗ</div><div class="val">${money(laiLo)}</div></div>
    </div>
    <div class="card" style="font-size:14px;">Cọc đang giữ (hiện tại): <b>${money(cocGiu)}</b> (không tính vào thu)</div>

    <div class="section-title">Thu theo danh mục</div>
    <table class="report-table">
      <tbody>
      ${thuRows.length ? thuRows.map(r=>`<tr><td>${r[0]}</td><td class="amt">${money(r[1])}</td></tr>`).join('') : '<tr><td colspan="2">Không có</td></tr>'}
      </tbody>
    </table>

    <div class="section-title">Chi theo danh mục</div>
    <table class="report-table">
      <tbody>
      ${chiRows.length ? chiRows.map(r=>`<tr><td>${r[0]}</td><td class="amt">${money(r[1])}</td></tr>`).join('') : '<tr><td colspan="2">Không có</td></tr>'}
      </tbody>
    </table>

    <div class="section-title">Theo món</div>
    <table class="report-table">
      <thead><tr><th>Món</th><th>Lượt</th><th>Doanh thu</th></tr></thead>
      <tbody>
      ${topItems.length ? topItems.map(r=>`<tr><td>${escapeHtml(r.name)}</td><td>${r.count}</td><td class="amt">${money(r.revenue)}</td></tr>`).join('') : '<tr><td colspan="3">Không có</td></tr>'}
      </tbody>
    </table>

    <div style="margin-top:16px;"><button class="btn secondary" id="btn-export-csv">Tải file Excel (CSV)</button></div>
  `;
  document.getElementById('btn-export-csv').addEventListener('click', ()=>exportCsv(tx, reportMonth));
}

function exportCsv(tx, monthStr){
  const header = ['Ngày giờ','Loại','Danh mục','Số tiền','Ghi chú'];
  const rows = tx.slice().sort((a,b)=> a.occurred_at < b.occurred_at ? -1 : 1).map(t=>[
    formatDateTimeForCsv(t.occurred_at),
    t.type==='thu'?'Thu':'Chi',
    CAT_LABEL[t.category]||t.category,
    Math.round(Number(t.amount)),
    t.note||''
  ]);
  function csvField(v){
    const s = String(v);
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  }
  const lines = [header, ...rows].map(r=>r.map(csvField).join(','));
  const csvContent = '﻿' + lines.join('\r\n');
  const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `thuchi_${monthStr}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
