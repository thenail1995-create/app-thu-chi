<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thu Chi Tiệm Thuê</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a6215a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thu Chi">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --accent:#a6215a;
    --accent-light:#f5e3ec;
    --bg:#f7f5f6;
    --card:#ffffff;
    --text:#232023;
    --muted:#767077;
    --danger:#c0392b;
    --danger-bg:#fdeceb;
    --ok:#1f8a53;
    --border:#e6e0e3;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
  }
  .hidden{display:none !important;}
  input,textarea,select,button{font-family:inherit;font-size:16px;}
  button{cursor:pointer;}

  /* ---------- Login ---------- */
  #login-screen{
    min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    align-items:center;padding:24px;
  }
  #login-screen h1{font-size:22px;margin-bottom:4px;text-align:center;}
  #login-screen p.sub{color:var(--muted);margin-top:0;margin-bottom:24px;text-align:center;}
  .login-box{width:100%;max-width:360px;background:var(--card);border-radius:var(--radius);
    padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.06);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;}
  .field input,.field textarea,.field select{
    width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:#fff;
  }
  .field textarea{resize:vertical;min-height:64px;}
  .btn{
    display:inline-block;border:none;border-radius:10px;padding:12px 18px;font-weight:600;
    background:var(--accent);color:#fff;width:100%;text-align:center;
  }
  .btn:active{opacity:.85;}
  .btn.secondary{background:#fff;color:var(--accent);border:1.5px solid var(--accent);}
  .btn.ghost{background:transparent;color:var(--accent);width:auto;padding:8px 10px;}
  .btn.danger{background:var(--danger);}
  .btn.block-sm{padding:10px 14px;font-size:14px;}
  #login-error{color:var(--danger);font-size:13px;margin-top:8px;min-height:16px;}

  /* ---------- App shell ---------- */
  #app-screen{min-height:100vh;display:flex;flex-direction:column;}
  #topbar{
    background:var(--accent);color:#fff;padding:14px 16px calc(14px + env(safe-area-inset-top,0px));
    display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;
  }
  #topbar .title{font-weight:700;font-size:17px;}
  #topbar .logout{background:transparent;border:none;color:#fff;font-size:13px;text-decoration:underline;}
  #tab-content{flex:1;padding:12px 12px 90px 12px;max-width:640px;margin:0 auto;width:100%;}
  #bottom-nav{
    position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);
    display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10;
  }
  #bottom-nav button{
    flex:1;background:none;border:none;padding:10px 4px 8px;color:var(--muted);font-size:13px;
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  #bottom-nav button .ic{font-size:20px;}
  #bottom-nav button.active{color:var(--accent);font-weight:700;}

  /* ---------- Cards / lists ---------- */
  .card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;
    box-shadow:0 1px 4px rgba(0,0,0,.05);}
  .section-title{font-size:15px;font-weight:700;margin:18px 0 8px;color:var(--text);}
  .section-title:first-child{margin-top:0;}
  .summary-row{display:flex;gap:8px;margin-bottom:4px;}
  .summary-item{flex:1;background:var(--card);border-radius:12px;padding:10px;text-align:center;
    box-shadow:0 1px 4px rgba(0,0,0,.05);}
  .summary-item .lbl{font-size:13px;color:var(--muted);}
  .summary-item .val{font-size:15px;font-weight:700;margin-top:2px;}

  .order-card{display:flex;flex-direction:column;gap:4px;}
  .order-card .row1{display:flex;justify-content:space-between;align-items:baseline;}
  .order-card .name{font-weight:700;}
  .order-card .time{font-weight:700;color:var(--accent);}
  .order-card .items{color:var(--muted);font-size:14px;}
  .order-card .meta{font-size:13px;color:var(--muted);}
  .order-card .actions{display:flex;gap:8px;margin-top:8px;}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:700;}
  .badge.booked{background:#e8eef7;color:#2b5fad;}
  .badge.picked_up{background:#fff3d6;color:#9a6b00;}
  .badge.returned{background:#e6f3ec;color:#1f8a53;}
  .badge.closed{background:#eee;color:#555;}
  .badge.cancelled{background:var(--danger-bg);color:var(--danger);}
  .overdue-card{border:1.5px solid var(--danger);}
  .overdue-card .time{color:var(--danger);}
  .overdue-tag{color:var(--danger);font-weight:700;font-size:13px;}
  a.tel-link{color:var(--accent);text-decoration:none;font-weight:600;}

  .empty-state{color:var(--muted);text-align:center;padding:20px 0;font-size:14px;}

  /* ---------- Fab buttons ---------- */
  .fab-row{display:flex;gap:10px;margin-bottom:14px;}
  .fab-row .btn{padding:16px;font-size:16px;}
  .btn.thu{background:var(--ok);}
  .btn.chi{background:var(--danger);}

  /* ---------- Filters ---------- */
  .filter-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .filter-row select,.filter-row input[type=text]{
    flex:1;min-width:100px;padding:9px;border:1px solid var(--border);border-radius:10px;
  }
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}
  .chip{padding:8px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:13px;}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* ---------- Transaction row ---------- */
  .tx-day-group{margin-bottom:10px;}
  .tx-day-label{font-size:13px;color:var(--muted);font-weight:700;margin:10px 0 4px;}
  .tx-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);
    border-radius:10px;padding:10px 12px;margin-bottom:6px;}
  .tx-row .cat{font-size:13px;color:var(--muted);}
  .tx-row .amt.thu{color:var(--ok);font-weight:700;}
  .tx-row .amt.chi{color:var(--danger);font-weight:700;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;
    justify-content:center;z-index:50;
  }
  .modal-box{
    background:#fff;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));
    width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
  }
  .modal-box h3{margin-top:0;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions.sticky-submit{position:sticky;bottom:0;background:var(--card);padding-top:8px;}
  .close-x{position:absolute;top:2px;right:6px;background:none;border:none;font-size:20px;color:var(--muted);width:44px;height:44px;display:flex;align-items:center;justify-content:center;}
  .modal-box{position:relative;}

  .kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .kv .k{color:var(--muted);}
  .kv .v{font-weight:600;text-align:right;}
  .remain-warn{color:var(--danger);font-weight:700;}
  .toast{
    position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#232023;color:#fff;
    padding:10px 18px;border-radius:10px;font-size:14px;z-index:100;opacity:0;transition:opacity .2s;
    pointer-events:none;max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;}
  table.report-table{width:100%;border-collapse:collapse;font-size:14px;}
  table.report-table th,table.report-table td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:left;}
  table.report-table td.amt{text-align:right;}
  .loading{text-align:center;color:var(--muted);padding:20px;font-size:14px;}
  .error-block{background:var(--danger-bg);color:var(--danger);border-radius:12px;padding:16px;text-align:center;font-size:14px;}
  .error-block button{margin-top:10px;}

  /* ---------- Phase 2: Tab Kho ---------- */
  .item-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .item-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05);text-align:left;border:none;padding:0;cursor:pointer;}
  .item-card .thumb{width:100%;aspect-ratio:1/1;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;}
  .item-card .thumb img{width:100%;height:100%;object-fit:cover;}
  .item-card .info{padding:8px 10px;}
  .item-card .name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;}
  .item-card .meta{color:var(--muted);font-size:13px;margin-top:2px;}
  .status-dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;}
  .status-dot.green{background:var(--ok);}
  .status-dot.yellow{background:#c9960c;}
  .status-dot.red{background:var(--danger);}
  .status-dot.gray{background:#9a9a9a;}
  .item-avail{font-size:13px;color:var(--muted);margin-top:2px;}
  .status-label{font-size:13px;margin-top:2px;}
  .status-label.green{color:var(--ok);}
  .status-label.yellow{color:#9a6b00;}
  .status-label.red{color:var(--danger);}
  .status-label.gray{color:var(--muted);}
  .amount-words{font-size:13px;color:var(--muted);margin-top:2px;min-height:16px;}
  .item-photo-lg{width:100%;aspect-ratio:1/1;border-radius:12px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:72px;overflow:hidden;margin-bottom:10px;}
  .item-photo-lg img{width:100%;height:100%;object-fit:cover;}
  .manual-status-chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
  .busy-row{display:flex;justify-content:space-between;background:var(--card);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:13px;border:1px solid var(--border);}
  .item-search-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .picked-item-row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:6px;}
  .picked-item-row.conflict{border-color:var(--danger);background:var(--danger-bg);}
  .picked-item-row input{width:110px;padding:6px;border:1px solid var(--border);border-radius:8px;}
  .picked-item-conflict-msg{color:var(--danger);font-size:13px;margin-top:2px;}
  .item-search-results{max-height:180px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;}
  .item-search-results:empty{display:none;border:none;margin-bottom:0;}
  .item-search-result-row{padding:8px 10px;border-bottom:1px solid var(--border);font-size:14px;cursor:pointer;}
  .item-search-result-row:last-child{border-bottom:none;}
</style>
</head>
<body>

<div id="login-screen">
  <h1>Thu Chi Tiệm Thuê</h1>
  <p class="sub">Đăng nhập để tiếp tục</p>
  <div class="login-box" id="login-box">
    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" required autocomplete="username">
      </div>
      <div class="field">

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const SUPABASE_URL = 'https://ttnfrnlsgmfmqcframzy.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0bmZybmxzZ21mbXFjZnJhbXp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NTU4ODIsImV4cCI6MjEwMTMzMTg4Mn0.yakuebMT8kCDuiODxCIiTXeq7nMjvJ2jh8dn3xtW7BA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CATS_THU = [
  ['tien_thue','Tiền thuê'],['phi_tre','Phí trễ'],['tien_den','Tiền đền'],
  ['phi_huy','Phí hủy'],['phu_thu_ship','Phụ thu ship'],['khac','Khác']

const CATS_CHI = [
  ['nhap_do','Nhập đồ'],['giat_ui','Giặt ủi'],['sua_chua','Sửa chữa'],
  ['mat_bang','Mặt bằng'],['marketing','Marketing'],['ship','Ship'],['khac','Khác']
];
const CAT_LABEL = Object.fromEntries([...CATS_THU,...CATS_CHI]);
const STATUS_LABEL = {booked:'Đã đặt',picked_up:'Khách đang giữ đồ',returned:'Đã trả đồ',closed:'Hoàn tất',cancelled:'Đã hủy'};
const DEPOSIT_LABEL = {cash:'Tiền mặt',cccd:'CCCD',cash_cccd:'Tiền mặt + CCCD',none:'Không cọc'};

// ---- Phase 2: Kho đồ ----
const CATEGORY_LABEL = {vay:'Váy', ao_dai:'Áo dài', phu_kien:'Phụ kiện', props:'Đạo cụ', khac:'Khác'};
const CATEGORY_EMOJI = {vay:'👗', ao_dai:'👘', phu_kien:'💍', props:'🎭', khac:'📦'};
const MANUAL_STATUS_LABEL = {ok:'Bình thường', giat:'Đang giặt', sua:'Đang sửa', hong:'Hỏng', nghi:'Ngưng cho thuê'};
const DEFAULT_BUFFER_BY_CATEGORY = {vay:24, ao_dai:24, phu_kien:0, props:0, khac:24};

let currentTab = 'today';
let currentUser = null;

// ---- Push notification: chỉ public key (an toàn để lộ) — private key CHỈ nằm trong Edge Function ----
const VAPID_PUBLIC_KEY = 'BPV1dyYgcMAhBQ03tj9N0jM5eaWsrZXihTqB2e1h0JurOy2igankg-sHZfmy2D0uOpJfjUI1s8kCVbAlTcvMIns';
const NOTIFY_FN_URL = 'https://ttnfrnlsgmfmqcframzy.supabase.co/functions/v1/notify';

/* ============================================================
   UTIL: tiền tệ + thời gian (múi giờ Asia/Ho_Chi_Minh, UTC+7 cố định)
   ============================================================ */
function money(n){
  n = Math.round(Number(n) || 0);
  return n.toLocaleString('vi-VN') + ' đ';
}
function parseMoneyInput(str){
  const digits = String(str||'').replace(/[^0-9]/g,'');
  return digits ? parseInt(digits,10) : 0;
}
function attachMoneyFormatting(input){
  input.addEventListener('blur', ()=>{
    const raw = parseMoneyInput(input.value);
    input.value = raw ? raw.toLocaleString('vi-VN') : '';
  });
}

// C6: đọc số tiền thành chữ tiếng Việt, vd 500000 -> "năm trăm nghìn đồng".
const VI_DIGIT = ['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
function viReadGroup(n, isFirstNonzeroGroup){
  const tram = Math.floor(n/100);
  const chuc = Math.floor((n%100)/10);
  const donvi = n%10;
  let s = '';
  if(tram > 0){
    s += VI_DIGIT[tram] + ' trăm';
  } else if(!isFirstNonzeroGroup){
    s += 'không trăm';
  }
  if(chuc === 0){
    if(donvi > 0){
      if(tram > 0 || !isFirstNonzeroGroup) s += ' lẻ';
      s += ' ' + VI_DIGIT[donvi];
    }
  } else if(chuc === 1){
    s += ' mười';
    if(donvi > 0) s += ' ' + (donvi===5?'lăm':(donvi===1?'một':VI_DIGIT[donvi]));
  } else {
    s += ' ' + VI_DIGIT[chuc] + ' mươi';
    if(donvi > 0){
      if(donvi===1) s += ' mốt';
      else if(donvi===5) s += ' lăm';
      else s += ' ' + VI_DIGIT[donvi];
    }
  }
  return s.trim();
}
function soTienThanhChu(n){
  n = Math.round(Number(n)||0);
  if(n === 0) return 'không đồng';
  if(n < 0) return 'âm ' + soTienThanhChu(-n);
  const scales = ['', ' nghìn', ' triệu', ' tỷ'];
  const groups = [];
  let x = n;
  while(x > 0){
    groups.push(x % 1000);
    x = Math.floor(x/1000);
  }
  const parts = [];
  for(let i=groups.length-1; i>=0; i--){
    const g = groups[i];
    if(g === 0) continue;
    const isFirstNonzeroGroup = parts.length === 0;
    parts.push(viReadGroup(g, isFirstNonzeroGroup) + (scales[i]||''));
  }
  return parts.join(' ').replace(/\s+/g,' ').trim() + ' đồng';
}
// Gắn dòng "đọc số thành chữ" dưới ô tiền, cập nhật khi blur — KHÔNG đổi cơ chế format-on-blur cũ
// (attachMoneyFormatting vẫn xử lý riêng, hàm này chỉ thêm nhánh hiển thị chữ, không đổi giá trị input).
function attachAmountInWords(inputEl, wordsEl){
  function update(){
    const val = parseMoneyInput(inputEl.value);
    wordsEl.textContent = val > 0 ? soTienThanhChu(val) : '';
  }
  inputEl.addEventListener('blur', update);
  update();
}

// yyyy-mm-dd của "hôm nay" theo giờ VN
function vnDateStr(d = new Date()){
  return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
}
// Khoảng [start,end) UTC ISO cho 1 ngày VN (yyyy-mm-dd)
function vnDayRange(dateStr){
  const start = new Date(dateStr + 'T00:00:00+07:00');
  const end = new Date(start.getTime() + 24*3600*1000);
  return {startISO:start.toISOString(), endISO:end.toISOString()};
}
// Khoảng [start,end) UTC ISO cho 1 tháng VN (yyyy-mm)
function vnMonthRange(yearMonthStr){
  try {
    const [y,m] = String(yearMonthStr).split('-').map(Number);
    if(!y || !m || m<1 || m>12) throw new Error('invalid yearMonthStr');
    const start = new Date(`${yearMonthStr}-01T00:00:00+07:00`);
    if(isNaN(start.getTime())) throw new Error('invalid date');
    const nextY = m===12 ? y+1 : y;
    const nextM = m===12 ? 1 : m+1;
    const end = new Date(`${nextY}-${String(nextM).padStart(2,'0')}-01T00:00:00+07:00`);
    if(isNaN(end.getTime())) throw new Error('invalid date');
    return {startISO:start.toISOString(), endISO:end.toISOString()};
  } catch(e){
    // Ngăn RangeError treo UI (finding #8) — rơi về tháng hiện tại nếu input sai định dạng
    const fallback = currentVnYearMonth();
    if(fallback === yearMonthStr) throw e; // tránh đệ quy vô hạn nếu currentVnYearMonth cũng lỗi
    return vnMonthRange(fallback);
  }
}
function currentVnYearMonth(){
  return vnDateStr().slice(0,7);
}
// Chọn tháng bằng 2 <select> thay vì <input type="month"> (finding #8 — type="month" không
// chạy trên iOS Safari và người dùng có thể gõ giá trị sai làm vnMonthRange ném lỗi).
function monthPickerHtml(idPrefix, value){
  const parts = String(value||currentVnYearMonth()).split('-').map(Number);
  const vy = parts[0], vm = parts[1];
  const nowY = Number(currentVnYearMonth().slice(0,4));
  let yearOpts = '';

/* ============================================================
   PHASE 2 — LỊCH TỪNG MÓN / CHỐNG TRÙNG LỊCH
   3 hàm THUẦN (không side-effect, không đụng DOM/DB) — test độc lập bằng node
   (xem /home/claude/test-schedule.js). KHÔNG được đụng vào các hàm tiền/cọc ở trên.

/**
 * itemBusyIntervals(item, orders, orderItems, nowMs) -> [{startMs, endMs, orderId, orderCode}]
 * Nguồn: các đơn status 'booked' hoặc 'picked_up' có chứa item đó (qua bảng order_items).
 * Mỗi đơn sinh 1 interval [pickup_at, effectiveEnd + buffer_hours]:
 *   - effectiveEnd = return_due_at   (đơn booked; hoặc đơn picked_up NHƯNG CÒN TRONG HẠN, tức
 *                                     dueMs >= nowMs — khách đang giữ đồ đúng hạn không bị chặn
 *                                     đặt trước vĩnh viễn, buffer cộng sau như thường)
 *   - effectiveEnd = Infinity        (đơn picked_up THỰC SỰ QUÁ HẠN, tức dueMs < nowMs — bận VÔ
 *                                     HẠN cho tới khi đổi status sang returned/closed, không hứa
 *                                     lịch cho ai khi chưa biết bao giờ khách trả đồ.
 *                                     Audit-phase2 #1: bản cũ dùng max(due,now) khiến khách quá
 *                                     hạn + buffer 0 vẫn hiện "sẵn sàng" — SAI.
 *                                     Audit-batch-UX-1 #1: bản kế tiếp áp Infinity cho MỌI đơn
 *                                     picked_up kể cả còn trong hạn — cũng SAI, chặn đặt trước
 *                                     vĩnh viễn cả khi khách chưa hề trễ hẹn. Sửa lại: chỉ quá
 *                                     hạn thật mới vô hạn.)
 * Đơn returned/closed/cancelled KHÔNG sinh interval (không chặn lịch), kể cả nếu buffer của
 * lần thuê đó còn "trong hạn giặt" — trạng thái chờ giặt thể hiện qua manual_status, không qua lịch.
 * buffer_hours âm (dữ liệu xấu lọt qua, lẽ ra bị chặn ở input/DB constraint — audit #4) được tự vệ
 * ép về 0 tại đây, không được phép lùi mốc kết thúc bận về trước return_due_at.
 *
 * Test case (xem file test-schedule.js, chạy `node test-schedule.js` phải in PASS toàn bộ):
 * 1. Hai đơn cùng ngày khác giờ, buffer 0 (props): 8-11h và 13-17h → KHÔNG trùng; 8-11h và 10-14h → TRÙNG.
 * 2. Buffer 24h: đơn A trả 17h ngày 5 → đơn B nhận 10h ngày 6 → TRÙNG (còn trong buffer); nhận 18h ngày 6 → KHÔNG trùng.
 * 3. Đơn qua đêm nhiều ngày.
 * 4. Đơn picked_up QUÁ HẠN thật (dueMs<nowMs) → bận VÔ HẠN (endMs=Infinity); picked_up ĐÚNG HẠN
 *    (dueMs>=nowMs) → bận tới due+buffer như đơn booked, đặt sau mốc đó ĐƯỢC.
 * 5. Sửa đơn: đổi giờ của chính đơn đang sửa không tự báo trùng với chính nó (excludeOrderId).
 * 6. Chạm mép: A kết thúc (kể cả buffer) đúng 14:00, B bắt đầu 14:00 → không trùng.
 * 7. Đơn cancelled/returned không chặn.
 * 8. buffer_hours âm bị ép về 0, không đảo/thu hẹp interval bận.
 */
function itemBusyIntervals(item, orders, orderItems, nowMs){
  const orderIdsForItem = new Set(
    orderItems.filter(oi=>oi.item_id===item.id).map(oi=>oi.order_id)
  );
  const result = [];
  for(const o of orders){
    if(!orderIdsForItem.has(o.id)) continue;
    if(o.status !== 'booked' && o.status !== 'picked_up') continue;
    const pickupMs = new Date(o.pickup_at).getTime();
    const dueMs = new Date(o.return_due_at).getTime();
    // Audit-batch-UX-1 #1: picked_up chỉ bận VÔ HẠN khi THỰC SỰ quá hạn (dueMs<nowMs); còn trong
    // hạn thì effectiveEnd = dueMs như đơn booked, buffer cộng sau như thường.
    const effectiveEnd = (o.status === 'picked_up' && dueMs < nowMs) ? Infinity : dueMs;
    const bufferMs = Math.max(0, Number(item.buffer_hours||0)) * 3600000;
    const endMs = effectiveEnd === Infinity ? Infinity : effectiveEnd + bufferMs;
    result.push({startMs: pickupMs, endMs, orderId: o.id, orderCode: o.code});
  }
  return result;
}

/**
 * checkConflict(itemId, startMs, endMs, bufferHours, busyIntervals, excludeOrderId, manualStatus) -> conflict|null
 * Interval đơn mới = [startMs, endMs + bufferHours].
 * Overlap chuẩn: aStart < bEnd && bStart < aEnd (chạm mép đúng bằng nhau = KHÔNG trùng).
 * excludeOrderId: khi SỬA đơn phải loại chính đơn đó ra khỏi busyIntervals trước khi so.
 * manualStatus != 'ok' → món không khả dụng bất kể lịch, trả về lý do riêng (kiểm tra trước, ưu tiên hơn lịch).
 */
function checkConflict(itemId, startMs, endMs, bufferHours, busyIntervals, excludeOrderId, manualStatus){
  if(manualStatus && manualStatus !== 'ok'){
    return {reason:'manual_status', manualStatus, itemId};
  }
  const newStart = startMs;
  const newEnd = endMs + Math.max(0, Number(bufferHours||0))*3600000;
  for(const iv of busyIntervals){
    if(excludeOrderId && iv.orderId === excludeOrderId) continue;
    if(newStart < iv.endMs && iv.startMs < newEnd){
      return {reason:'schedule', itemId, orderId: iv.orderId, orderCode: iv.orderCode, busyStartMs: iv.startMs, busyEndMs: iv.endMs};
    }
  }
  return null;
}

/**
 * nextAvailableMs(item, busyIntervals, nowMs) -> ms|null
 * "Dự kiến có lại": merge các interval bận giao/chạm nhau (chuỗi đơn nối tiếp), tìm chuỗi merge
 * đang chứa thời điểm nowMs, trả về mốc kết thúc (ms) của chuỗi đó. Không bận ngay lúc nowMs → null
 * (sẵn sàng ngay), kể cả khi có đơn bận trong tương lai xa hơn.
 */
function nextAvailableMs(item, busyIntervals, nowMs){
  if(!busyIntervals.length) return null;
  const sorted = busyIntervals.slice().sort((a,b)=>a.startMs-b.startMs);
  const merged = [];
  for(const iv of sorted){
    const last = merged[merged.length-1];
    if(last && iv.startMs <= last.endMs){
      if(iv.endMs > last.endMs) last.endMs = iv.endMs;
    } else {
      merged.push({startMs: iv.startMs, endMs: iv.endMs});
    }
  }
  for(const m of merged){
    if(m.startMs <= nowMs && nowMs < m.endMs){
      return m.endMs;
    }
  }
  return null;
}

   PHASE 2 — helper UI (dùng 3 hàm thuần ở trên, không phải hàm thuần)

// Trạng thái hiển thị của 1 món trên lưới Kho: xanh sẵn sàng / vàng đã đặt trong 3 ngày tới
// (kèm giờ cụ thể nếu trong 24h tới) / đỏ đang thuê / xám giặt-sửa-hỏng-nghỉ.
// audit-phase2 #9: manual_status vẫn ưu tiên hiển thị (chip xám), NHƯNG nếu món đang thực sự
// nằm trong 1 đơn active (đã giao đồ) thì label ghi rõ thêm "(đang thuê)" — không che mất lịch
// thật; checkConflict vẫn luôn chặn theo manual_status trước, không đổi.
// audit-phase2 #1: đơn picked_up chưa trả → itemBusyIntervals trả endMs=Infinity → "Có lại" là
// KHÔNG XÁC ĐỊNH (nextAvailableUnknown), không được format thành ngày (tránh Invalid Date).
function computeItemStatus(item, orders, orderItems, nowMs){
  const busy = itemBusyIntervals(item, orders, orderItems, nowMs);
  const currentlyBusy = busy.find(iv=>iv.startMs<=nowMs && nowMs<iv.endMs);

  if(item.manual_status !== 'ok'){
    const baseLabel = MANUAL_STATUS_LABEL[item.manual_status]||item.manual_status;
    return {
      color:'gray',
      label: currentlyBusy ? `${baseLabel} (đang thuê)` : baseLabel,
      nextAvailableMs:null, nextAvailableUnknown:false
    };
  }

  if(currentlyBusy){
    const nav = nextAvailableMs(item, busy, nowMs);
    return {color:'red', label:'Đang thuê', nextAvailableMs: nav===Infinity?null:nav, nextAvailableUnknown: nav===Infinity};
  }

  // Chưa bận ngay lúc này: tìm interval bận SẮP TỚI gần nhất để quyết định vàng + hiện giờ cụ thể
  // nếu bắt đầu trong 24h tới (audit #8 — trước đây chỉ có nhãn "Đã đặt" chung chung, không giờ).
  const future = busy.filter(iv=>iv.startMs > nowMs).sort((a,b)=>a.startMs-b.startMs);
  if(future.length){
    const next = future[0];
    const in24h = nowMs + 24*3600000;
    const in3Days = nowMs + 3*24*3600000;
    if(next.startMs <= in24h){
      const iso = new Date(next.startMs).toISOString();
      return {color:'yellow', label:`Đã đặt ${formatTimeVN(iso)} ${formatShortDateVN(iso)}`, nextAvailableMs:null, nextAvailableUnknown:false};
    }
    if(next.startMs <= in3Days){
      return {color:'yellow', label:'Đã đặt', nextAvailableMs:null, nextAvailableUnknown:false};
    }
  }
  return {color:'green', label:'Sẵn sàng', nextAvailableMs:null, nextAvailableUnknown:false};
}

// audit ux-fix-batch1 A2: trạng thái món tính theo 1 NGÀY ĐANG CHỌN (không phải Date.now()).
// Ngày = hôm nay: giữ nguyên logic "đang thuê ngay lúc này" / "đã đặt trong 24h/3 ngày tới" như
// computeItemStatus ở trên. Ngày khác: dùng checkConflict với khoảng [00:00,24:00) giờ VN của
// ngày đó (hàm thuần checkConflict KHÔNG bị sửa, chỉ gọi với interval là cả ngày).
function computeItemStatusForDate(item, orders, orderItems, dateStr){
  const nowMs = Date.now();
  const isToday = dateStr === vnDateStr();
  const busy = itemBusyIntervals(item, orders, orderItems, nowMs);

  // Audit-batch-UX-1 #4: 'hong'/'nghi' luôn chặn mọi ngày (hỏng/ngưng cho thuê không tự hết hạn).
  // 'giat'/'sua' chỉ phản ánh tình trạng HÔM NAY — ngày TƯƠNG LAI tính theo lịch như bình thường
  // (món sẽ giặt/sửa xong trước đó), chỉ kèm chú thích nhỏ chứ không chặn.
  const manualBlocksAlways = item.manual_status==='hong' || item.manual_status==='nghi';
  const manualIsTemporary = item.manual_status==='giat' || item.manual_status==='sua';

  if(manualBlocksAlways){
    const baseLabel = MANUAL_STATUS_LABEL[item.manual_status]||item.manual_status;
    const currentlyBusyNow = isToday && busy.some(iv=>iv.startMs<=nowMs && nowMs<iv.endMs);
    return {
      color:'gray',
      label: currentlyBusyNow ? `${baseLabel} (đang thuê)` : baseLabel,
      nextAvailableMs:null, nextAvailableUnknown:false
    };
  }
  if(manualIsTemporary && isToday){
    const baseLabel = MANUAL_STATUS_LABEL[item.manual_status]||item.manual_status;
    const currentlyBusyNow = busy.some(iv=>iv.startMs<=nowMs && nowMs<iv.endMs);
    return {
      color:'gray',
      label: currentlyBusyNow ? `${baseLabel} (đang thuê)` : baseLabel,
      nextAvailableMs:null, nextAvailableUnknown:false
    };
  }

  if(isToday){
    const currentlyBusy = busy.find(iv=>iv.startMs<=nowMs && nowMs<iv.endMs);
    if(currentlyBusy){
      const nav = nextAvailableMs(item, busy, nowMs);
      return {color:'red', label:'Đang thuê', nextAvailableMs: nav===Infinity?null:nav, nextAvailableUnknown: nav===Infinity};
    }
    const future = busy.filter(iv=>iv.startMs > nowMs).sort((a,b)=>a.startMs-b.startMs);
    if(future.length){
      const next = future[0];
      const in24h = nowMs + 24*3600000;
      const in3Days = nowMs + 3*24*3600000;
      if(next.startMs <= in24h){
        const iso = new Date(next.startMs).toISOString();
        return {color:'yellow', label:`Đã đặt ${formatTimeVN(iso)} ${formatShortDateVN(iso)}`, nextAvailableMs:null, nextAvailableUnknown:false};
      }
      if(next.startMs <= in3Days){
        return {color:'yellow', label:'Đã đặt', nextAvailableMs:null, nextAvailableUnknown:false};
      }
    }
    return {color:'green', label:'Sẵn sàng', nextAvailableMs:null, nextAvailableUnknown:false};
  }

  // Ngày khác hôm nay: hỏi checkConflict xem cả ngày [00:00,24:00) giờ VN có đụng lịch không.
  // 'giat'/'sua' KHÔNG được truyền vào để chặn ở đây (coi như 'ok'), chỉ 'hong'/'nghi' mới chặn
  // (đã return sớm ở nhánh manualBlocksAlways phía trên nên tới đây chắc chắn không phải 2 loại đó).
  const noteSuffix = manualIsTemporary ? ` (hôm nay đang ${item.manual_status==='giat'?'giặt':'sửa'})` : '';
  const {startISO, endISO} = vnDayRange(dateStr);
  const dayStartMs = new Date(startISO).getTime();
  const dayEndMs = new Date(endISO).getTime();
  const conflict = checkConflict(item.id, dayStartMs, dayEndMs, item.buffer_hours, busy, null, 'ok');
  if(conflict){
    return {color:'yellow', label:'Vướng lịch (kể cả giờ nghỉ giặt)'+noteSuffix, nextAvailableMs:null, nextAvailableUnknown:false};
  }
  return {color:'green', label:'Còn trống ngày này'+noteSuffix, nextAvailableMs:null, nextAvailableUnknown:false};
}

// Giá gợi ý 1 món theo khoảng thời gian thuê.
// audit-phase2 #6: công thức cũ dùng ngưỡng "≤8h thì tính theo giờ, ngược lại theo ngày" không
// đơn điệu (8h có thể ra giá CAO hơn 8.5h) và món chỉ có giá giờ + thuê nhiều ngày sẽ ra 0đ
// (vì nhánh ngày dùng rent_price_day=0). SỬA: gợi ý = max(giá theo giờ nếu có rent_price_hour,
// giá theo ngày nếu có rent_price_day) — max của 2 hàm không giảm nên luôn đơn điệu; nếu món
// không có giá nào cả thì trả về 0 và bên gọi phải KHÔNG ghi 0 vào ô tiền (hiện cảnh báo thay vì).
function computeItemSuggestedPrice(item, hours){
  const byHour = Number(item.rent_price_hour) > 0 ? Math.round(hours * Number(item.rent_price_hour)) : 0;
  const byDay = Number(item.rent_price_day) > 0 ? Math.ceil(hours/24) * Number(item.rent_price_day) : 0;
  return Math.max(byHour, byDay);
}

// Resize ảnh client-side còn tối đa maxDim px (giữ tỉ lệ) trước khi upload, trả về Blob JPEG.
// audit-phase2 #11: chặn file gốc quá lớn TRƯỚC KHI decode (tránh treo máy yếu với ảnh siêu to).
const MAX_ITEM_PHOTO_INPUT_BYTES = 20*1024*1024;
function resizeImageFile(file, maxDim){
  maxDim = maxDim || 800;
  return new Promise((resolve, reject)=>{
    if(file.size > MAX_ITEM_PHOTO_INPUT_BYTES){
      reject(new Error('Ảnh quá lớn (>20MB), chọn ảnh nhỏ hơn'));
      return;
    }
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let {width, height} = img;
      if(width > maxDim || height > maxDim){
        if(width >= height){ height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob=>{
        if(!blob) reject(new Error('Không resize được ảnh'));
        else resolve(blob);
      }, 'image/jpeg', 0.82);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('Không đọc được file ảnh')); };
    img.src = url;
  });
}

// Upload ảnh (đã resize) lên storage bucket item-photos, tên file {item_id}.jpg, trả về public URL.
async function uploadItemPhoto(itemId, blob){
  const path = `${itemId}.jpg`;
  const {error} = await sb.storage.from('item-photos').upload(path, blob, {upsert:true, contentType:'image/jpeg'});
  if(error) throw error;
  const {data} = sb.storage.from('item-photos').getPublicUrl(path);
  return data.publicUrl;
}

let pendingAuthUser = null;
async function afterLogin(user){
  pendingAuthUser = user;
  // Kiểm tra whitelist app_users để có UX rõ ràng (RLS đã chặn dữ liệu ở tầng DB dù thế nào)
  const {data: whitelistRow, error} = await sb.from('app_users').select('user_id').eq('user_id', user.id).maybeSingle();
  if(error){
    // Lỗi mạng/query: GIỮ phiên đăng nhập, không signOut, chỉ hiện khối thử lại
    document.getElementById('login-box').classList.add('hidden');
    document.getElementById('login-retry-box').classList.remove('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('app-screen').classList.add('hidden');
    return;
  }
  if(!whitelistRow){
    document.getElementById('login-box').classList.remove('hidden');
    document.getElementById('login-retry-box').classList.add('hidden');
    document.getElementById('login-error').textContent = 'Tài khoản không có quyền truy cập.';
    pendingAuthUser = null;
    await sb.auth.signOut();
    return;
  }
  pendingAuthUser = null;
  currentUser = user;
  document.getElementById('login-box').classList.remove('hidden');
  document.getElementById('login-retry-box').classList.add('hidden');
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-screen').classList.remove('hidden');
  registerServiceWorkerIfSupported();
  switchTab('today');
}

async function initSession(){
  const {data} = await sb.auth.getSession();
  if(data.session && data.session.user){
    await afterLogin(data.session.user);

}

function modalHasContent(){
  const box = document.querySelector('.modal-box');
  if(!box) return false;
  const fields = box.querySelectorAll('input, textarea');
  for(const f of fields){

  if(box.querySelectorAll('.picked-item-row').length > 0) return true;
  return false;

/* ============================================================
   PUSH NOTIFICATIONS
   ============================================================ */
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i=0; i<rawData.length; i++){
    outputArray[i] = rawData.charCodeAt(i);
  }
  return outputArray;
}
function pushSupported(){
  return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
}
function isIOSDevice(){
  return /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function isStandaloneDisplay(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
}
async function registerServiceWorkerIfSupported(){
  if(!pushSupported()) return;
  try{
    await navigator.serviceWorker.register('sw.js');
  }catch(e){
    // Im lặng — không chặn app nếu đăng ký SW lỗi (trình duyệt cũ, môi trường không hỗ trợ...).
  }
}
async function hasDbPushSubscription(){
  if(!pushSupported()) return false;
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(!sub) return false;
    const {data} = await sb.from('push_subscriptions').select('id').eq('endpoint', sub.endpoint).maybeSingle();
    return !!data;
  }catch(e){
    return false;
  }
}
// Trạng thái card "🔔 Bật thông báo" trên tab Hôm nay:
// 'enable' = hiện nút bật (chưa granted, hoặc granted nhưng chưa có subscription trong DB)
// 'ios-install' = iOS Safari chưa cài PWA ra màn hình chính (Push API chưa khả dụng)
// 'active' = đã bật + có subscription trong DB → hiện dòng nhỏ + nút "Tắt"
// 'hidden' = không đăng nhập, permission đã denied, hoặc trình duyệt desktop không hỗ trợ (không phải iOS)
async function computePushCardState(){
  if(!currentUser) return {state:'hidden'};
  if(!pushSupported()){
    if(isIOSDevice() && !isStandaloneDisplay()) return {state:'ios-install'};
    return {state:'hidden'};
  }
  if(Notification.permission === 'denied') return {state:'hidden'};
  if(Notification.permission !== 'granted') return {state:'enable'};
  const hasDb = await hasDbPushSubscription();
  return {state: hasDb ? 'active' : 'enable'};
}
function pushCardHtml(pc){
  if(!pc || pc.state === 'hidden') return '';
  if(pc.state === 'ios-install'){
    return `<div class="card" id="push-card">
      <div style="font-weight:700;margin-bottom:4px;">🔔 Bật thông báo</div>
      <div style="font-size:13px;color:var(--muted);">Cài app ra màn hình chính trước rồi mở từ icon để bật thông báo.</div>
    </div>`;
  }
  if(pc.state === 'active'){
    return `<div class="card" id="push-card" style="display:flex;justify-content:space-between;align-items:center;">
      <div style="font-size:13px;">🔔 Đã bật thông báo</div>
      <button type="button" class="btn ghost block-sm" id="btn-disable-push">Tắt</button>
    </div>`;
  }
  return `<div class="card" id="push-card">
    <div style="font-weight:700;margin-bottom:6px;">🔔 Bật thông báo</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:8px;">Nhận nhắc lịch nhận/trả đồ và tổng kết thu chi mỗi ngày.</div>
    <button type="button" class="btn block-sm" id="btn-enable-push">Bật thông báo</button>
  </div>`;
}
async function subscribeToPush(){
  if(!pushSupported()) return;
  try{
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){
      toast('Bạn đã từ chối quyền thông báo');
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const subJson = sub.toJSON();
    const deviceLabel = (navigator.userAgent || '').slice(0, 120);
    const {error: upsertErr} = await sb.from('push_subscriptions').upsert({
      endpoint: sub.endpoint,
      subscription: subJson,
      device_label: deviceLabel
    }, {onConflict: 'endpoint'});
    if(upsertErr){ toast('Lỗi lưu đăng ký: '+viError(upsertErr), 4000); return; }

    // Gửi push thử NGAY tới đúng endpoint vừa đăng ký — xác thực bằng JWT của user đang đăng nhập
    // (KHÔNG dùng NOTIFY_SECRET ở client, secret chỉ nằm trong Edge Function + lệnh cron).
    try{
      const {data: sessionData} = await sb.auth.getSession();
      const accessToken = sessionData && sessionData.session && sessionData.session.access_token;
      if(accessToken){
        await fetch(NOTIFY_FN_URL, {
          method: 'POST',
          headers: {'Content-Type':'application/json', 'Authorization': 'Bearer '+accessToken},
          body: JSON.stringify({mode:'test', endpoint: sub.endpoint})
        });
      }
    }catch(e){
      // Không chặn — subscription đã lưu DB thành công dù gọi thử thất bại (vd mất mạng đúng lúc đó).
    }
    toast('Đã bật — kiểm tra thông báo vừa gửi');
    if(currentTab==='today') renderToday();
  }catch(e){
    toast('Lỗi bật thông báo: '+(e && e.message ? e.message : String(e)), 4000);
  }
}
async function unsubscribeFromPush(){
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(sub){
      const endpoint = sub.endpoint;
      await sub.unsubscribe();
      await sb.from('push_subscriptions').delete().eq('endpoint', endpoint);
    }
    toast('Đã tắt thông báo');
    if(currentTab==='today') renderToday();
  }catch(e){
    toast('Lỗi tắt thông báo: '+(e && e.message ? e.message : String(e)), 4000);
  }
}

/* ============================================================
   TAB 1: HÔM NAY
   ============================================================ */
async function renderToday(){
  const el = document.getElementById('tab-content');
  el.innerHTML = '<div class="loading">Đang tải...</div>';

  const today = vnDateStr();
  const {startISO:dayStart, endISO:dayEnd} = vnDayRange(today);
  const {startISO:monthStart, endISO:monthEnd} = vnMonthRange(currentVnYearMonth());

  const [ordersRes, txMonthRes, custRes, orderItemsRes] = await Promise.all([
    // B11: chỉ lấy đơn còn "sống" (đang cần theo dõi trong ngày) + giới hạn số dòng, tránh tải cả bảng.
    sb.from('orders').select('*').in('status',['booked','picked_up','returned']).order('pickup_at',{ascending:true}).limit(500),
    sb.from('transactions').select('*').gte('occurred_at', monthStart).lt('occurred_at', monthEnd),
    sb.from('customers').select('id,name,phone'),
    sb.from('order_items').select('order_id, item:items(name)')
  ]);
  if(ordersRes.error || txMonthRes.error || custRes.error || orderItemsRes.error){
    el.innerHTML = `<div class="error-block">Không tải được dữ liệu — kiểm tra mạng rồi bấm Tải lại.<br><button class="btn" id="btn-today-retry">Tải lại</button></div>`;
    document.getElementById('btn-today-retry').addEventListener('click', renderToday);
    return;
  }
  const orders = ordersRes.data || [];
  const txMonth = txMonthRes.data || [];
  const customers = Object.fromEntries((custRes.data||[]).map(c=>[c.id,c]));
  const itemNamesByOrder = {};
  (orderItemsRes.data||[]).forEach(oi=>{
    if(!oi.item) return;
    (itemNamesByOrder[oi.order_id] = itemNamesByOrder[oi.order_id]||[]).push(oi.item.name);
  });
  const pushCard = await computePushCardState();

  const dayStartMsForTx = new Date(dayStart).getTime();
  const dayEndMsForTx = new Date(dayEnd).getTime();
  // B11: "Thu hôm nay" lọc client-side trên txMonth (đã scope theo tháng ở server) — hôm nay
  // luôn nằm trong tháng hiện tại nên không cần thêm 1 round-trip server riêng.
  const txToday = txMonth.filter(t=>{
    const ms = new Date(t.occurred_at).getTime();
    return ms>=dayStartMsForTx && ms<dayEndMsForTx;
  });
  const thuHomNay = txToday.filter(t=>t.type==='thu').reduce((s,t)=>s+Number(t.amount),0);
  const thuThang = txMonth.filter(t=>t.type==='thu').reduce((s,t)=>s+Number(t.amount),0);
  const chiThang = txMonth.filter(t=>t.type==='chi').reduce((s,t)=>s+Number(t.amount),0);
  const cocGiu = orders.reduce((s,o)=>s+depositHeld(o),0);
  const waitingDepositReturn = orders.filter(o=>o.status==='returned' && depositHeld(o) > 0);

  // So sánh bằng getTime() thay vì so sánh chuỗi ISO thô (finding #7): PostgREST và
  // toISOString() có thể trả về định dạng offset khác nhau (+00:00 vs .000Z) khiến so sánh
  // chuỗi sai lệch quanh mốc nửa đêm giờ VN.
  const dayStartMs = new Date(dayStart).getTime();
  const dayEndMs = new Date(dayEnd).getTime();
  const nowMs = Date.now();

  // pickup_at < dayEnd (không chỉ trong hôm nay) để đơn booked trễ hẹn nhận không biến mất khỏi Tab Hôm nay (finding #14)
  const pickupToday = orders.filter(o=>o.status==='booked' && new Date(o.pickup_at).getTime() < dayEndMs);
  const overdue = orders.filter(o=>o.status==='picked_up' && new Date(o.return_due_at).getTime() < nowMs);
  const overdueIds = new Set(overdue.map(o=>o.id));
  // Loại các đơn đã nằm trong "Quá hạn" khỏi "Trả đồ hôm nay" để không hiện trùng 2 khối (finding #13)
  const returnToday = orders.filter(o=>o.status==='picked_up' && !overdueIds.has(o.id) && new Date(o.return_due_at).getTime()>=dayStartMs && new Date(o.return_due_at).getTime()<dayEndMs);

  function custInfo(o){
    const c = customers[o.customer_id];
    return c || {name:'(?)', phone:''};
  }
  function overdueDuration(returnDueAt){
    const diffMs = Date.now() - new Date(returnDueAt).getTime();
    const hours = Math.floor(diffMs/3600000);
    if(hours < 1){
      const minutes = Math.max(0, Math.floor(diffMs/60000));
      return `Trễ ${minutes} phút`;
    }
    if(hours < 24) return `Trễ ${hours} giờ`;
    const days = Math.floor(hours/24);
    return `Trễ ${days} ngày`;
  }

  function renderOrderCard(o, opts){
    const c = custInfo(o);
    const isOverdue = opts.overdue;
    const khoNames = itemNamesByOrder[o.id];
    const itemsLabel = [khoNames && khoNames.length ? khoNames.join(', ') : '', o.items_text || ''].filter(Boolean).join(' · ');
    return `<div class="card order-card ${isOverdue?'overdue-card':''}" data-order-id="${o.id}">
      <div class="row1">
        <span class="name">${escapeHtml(c.name)}</span>
        <span class="time">${opts.timeLabel}</span>
      </div>
      <div class="items">${escapeHtml(itemsLabel)}</div>
      <div class="meta">
        ${c.phone ? `<a class="tel-link" href="tel:${escapeHtml(c.phone)}">📞 ${escapeHtml(c.phone)}</a> · ` : ''}
        ${money(o.rental_price)}
      </div>
      ${isOverdue ? `<div class="overdue-tag">${opts.lateLabel||''}</div>` : ''}
      <div class="actions">
        ${opts.action}
      </div>
    </div>`;
  }

  let html = '';
  html += pushCardHtml(pushCard);
  html += `<div class="summary-row">
    <div class="summary-item" id="tile-thu-hom-nay" style="cursor:pointer;"><div class="lbl">Thu hôm nay</div><div class="val">${money(thuHomNay)}</div></div>
    <div class="summary-item"><div class="lbl">Thu tháng</div><div class="val">${money(thuThang)}</div></div>
  </div>`;
  html += `<div class="summary-row">
    <div class="summary-item"><div class="lbl">Chi tháng</div><div class="val">${money(chiThang)}</div></div>
    <div class="summary-item" id="tile-coc-giu" style="cursor:pointer;"><div class="lbl">Cọc đang giữ</div><div class="val">${money(cocGiu)}</div><div style="font-size:11px;color:var(--muted);">(tiền cọc đang cầm của khách)</div></div>
  </div>`;

  if(waitingDepositReturn.length){
    html += `<div class="section-title">⏳ Chờ hoàn cọc</div>`;
    html += waitingDepositReturn.map(o=>{
      const c = custInfo(o);
      return `<div class="card order-card" data-order-id="${o.id}">
        <div class="row1">
          <span class="name">${escapeHtml(c.name)}</span>
          <span class="time">${o.code}</span>
        </div>
        <div class="meta">Cọc đang giữ: ${money(depositHeld(o))}</div>
        <div class="actions">
          <button class="btn block-sm" data-action="quick-return-deposit" data-id="${o.id}">Hoàn cọc</button>
          <button class="btn secondary block-sm" data-action="open-order" data-id="${o.id}">Chi tiết</button>
        </div>
      </div>`;
    }).join('');
  }

  if(overdue.length){
    html += `<div class="section-title">⚠️ Quá hạn</div>`;
    html += overdue.map(o=>renderOrderCard(o,{
      overdue:true, timeLabel: formatDateTimeVN(o.return_due_at),
      lateLabel: overdueDuration(o.return_due_at),
      action:`<button class="btn block-sm" data-action="pickedup-to-returned" data-id="${o.id}">Đã nhận lại đồ</button>
              <button class="btn secondary block-sm" data-action="open-order" data-id="${o.id}">Chi tiết</button>`
    })).join('');
  }

  html += `<div class="section-title">Nhận đồ hôm nay</div>`;
  html += pickupToday.length ? pickupToday.map(o=>{
    const isLatePickup = new Date(o.pickup_at).getTime() < nowMs;
    return renderOrderCard(o,{
      overdue:isLatePickup, timeLabel: formatTimeVN(o.pickup_at),
      lateLabel: isLatePickup ? `Chưa lấy đồ — ${overdueDuration(o.pickup_at)}` : '',
      action:`<button class="btn block-sm" data-action="booked-to-pickedup" data-id="${o.id}">Đã giao đồ</button>
              <button class="btn secondary block-sm" data-action="open-order" data-id="${o.id}">Chi tiết</button>`
    });
  }).join('') : `<div class="empty-state">Không có đơn nhận đồ hôm nay</div>`;

  html += `<div class="section-title">Trả đồ hôm nay</div>`;
  html += returnToday.length ? returnToday.map(o=>renderOrderCard(o,{
    overdue:false, timeLabel: formatTimeVN(o.return_due_at),
    action:`<button class="btn block-sm" data-action="pickedup-to-returned" data-id="${o.id}">Đã nhận lại đồ</button>
            <button class="btn secondary block-sm" data-action="open-order" data-id="${o.id}">Chi tiết</button>`
  })).join('') : `<div class="empty-state">Không có đơn trả đồ hôm nay</div>`;

  el.innerHTML = html;

  el.querySelectorAll('[data-action="open-order"]').forEach(b=>b.addEventListener('click',()=>openOrderDetail(b.dataset.id)));
  el.querySelectorAll('[data-action="booked-to-pickedup"]').forEach(b=>b.addEventListener('click',()=>flowBookedToPickedUp(b.dataset.id, renderToday)));
  el.querySelectorAll('[data-action="pickedup-to-returned"]').forEach(b=>b.addEventListener('click',()=>flowPickedUpToReturned(b.dataset.id, renderToday)));
  el.querySelectorAll('[data-action="quick-return-deposit"]').forEach(b=>b.addEventListener('click', async ()=>{
    const o = orders.find(x=>x.id===b.dataset.id);
    if(!o) return;
    const {data: tx, error} = await sb.from('transactions').select('*').eq('order_id', o.id);
    if(error){ toastError(error); return; }
    const remaining = orderRemaining(o, tx||[]);
    flowReturnDeposit(o, remaining, renderToday);
  }));
  document.getElementById('tile-thu-hom-nay')?.addEventListener('click', ()=>{
    cashflowDateScope = 'today';
    switchTab('cashflow');
  });
  document.getElementById('tile-coc-giu')?.addEventListener('click', ()=>{
    openDepositHeldListModal(orders, customers);
  });
  document.getElementById('btn-enable-push')?.addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    btn.disabled = true;
    btn.textContent = 'Đang bật...';
    await subscribeToPush();
    btn.disabled = false;
    btn.textContent = 'Bật thông báo';
  });
  document.getElementById('btn-disable-push')?.addEventListener('click', async ()=>{
    if(!confirm('Tắt thông báo trên thiết bị này?')) return;
    await unsubscribeFromPush();
  });
}

// C7: danh sách đơn đang giữ cọc (mã, tên khách, số cọc còn giữ) — depositHeld() GIỮ NGUYÊN công thức.
function openDepositHeldListModal(orders, customers){
  const held = orders.filter(o=>depositHeld(o) > 0);
  openModal(`
    <h3>Cọc đang giữ</h3>
    ${held.length ? held.map(o=>{
      const c = customers[o.customer_id] || {name:'(?)'};
      return `<div class="kv"><span class="k">${o.code} — ${escapeHtml(c.name)}</span><span class="v">${money(depositHeld(o))}</span></div>`;
    }).join('') : `<div class="empty-state">Không có đơn nào đang giữ cọc</div>`}
    <div class="modal-actions"><button class="btn secondary" id="btn-close-deposit-list">Đóng</button></div>
  `);
  document.getElementById('btn-close-deposit-list').addEventListener('click', closeModal);
}

let ordersFilterStatus = 'all';
let ordersSearchTerm = '';

async function renderOrders(){
  const el = document.getElementById('tab-content');
  el.innerHTML = '<div class="loading">Đang tải...</div>';

  const [ordersRes, custRes, orderItemsRes] = await Promise.all([
    sb.from('orders').select('*').order('created_at',{ascending:false}),
    sb.from('customers').select('id,name,phone'),
    sb.from('order_items').select('order_id, item:items(name)')
  ]);
  if(ordersRes.error || custRes.error || orderItemsRes.error){
    el.innerHTML = `<div class="error-block">Không tải được dữ liệu — kiểm tra mạng rồi bấm Tải lại.<br><button class="btn" id="btn-orders-retry">Tải lại</button></div>`;
    document.getElementById('btn-orders-retry').addEventListener('click', renderOrders);
    return;
  }
  const orders = ordersRes.data || [];
  const customers = Object.fromEntries((custRes.data||[]).map(c=>[c.id,c]));
  const itemNamesByOrder = {};
  (orderItemsRes.data||[]).forEach(oi=>{
    if(!oi.item) return;
    (itemNamesByOrder[oi.order_id] = itemNamesByOrder[oi.order_id]||[]).push(oi.item.name);
  });

  let html = `<div class="fab-row">
    <button class="btn" id="btn-new-order">+ Đơn mới</button>
  </div>`;
  html += `<div class="filter-row">
    <select id="filter-status">
      <option value="all">Tất cả trạng thái</option>
      <option value="booked">Đã đặt</option>
      <option value="picked_up">Khách đang giữ đồ</option>
      <option value="returned">Đã trả đồ</option>
      <option value="closed">Hoàn tất</option>
      <option value="cancelled">Đã hủy</option>
    </select>
  </div>
  <div class="filter-row">
    <input type="text" id="search-order" placeholder="Tìm tên / SĐT / mã đơn" value="${escapeHtml(ordersSearchTerm)}">
  </div>`;
  html += `<div id="orders-list"></div>`;
  el.innerHTML = html;

  document.getElementById('filter-status').value = ordersFilterStatus;
  document.getElementById('filter-status').addEventListener('change',(e)=>{
    ordersFilterStatus = e.target.value;
    paintOrdersList(orders, customers, itemNamesByOrder);
  });
  document.getElementById('search-order').addEventListener('input',(e)=>{
    ordersSearchTerm = e.target.value;
    paintOrdersList(orders, customers, itemNamesByOrder);
  });
  document.getElementById('btn-new-order').addEventListener('click', ()=>openNewOrderModal());

  paintOrdersList(orders, customers, itemNamesByOrder);
}

function paintOrdersList(orders, customers, itemNamesByOrder){
  const listEl = document.getElementById('orders-list');
  const term = ordersSearchTerm.trim().toLowerCase();
  const filtered = orders.filter(o=>{
    if(ordersFilterStatus !== 'all' && o.status !== ordersFilterStatus) return false;
    if(!term) return true;
    const c = customers[o.customer_id] || {};
    return (c.name||'').toLowerCase().includes(term) ||
           (c.phone||'').toLowerCase().includes(term) ||
           (o.code||'').toLowerCase().includes(term);
  });
  if(!filtered.length){
    listEl.innerHTML = `<div class="empty-state">Không có đơn nào</div>`;
    return;
  }
  listEl.innerHTML = filtered.map(o=>{
    const c = customers[o.customer_id] || {name:'(?)',phone:''};
    const khoNames = (itemNamesByOrder||{})[o.id];
    const itemsLabel = [khoNames && khoNames.length ? khoNames.join(', ') : '', o.items_text || ''].filter(Boolean).join(' · ');
    return `<div class="card order-card" data-order-id="${o.id}">
      <div class="row1">
        <span class="name">${escapeHtml(c.name)} <span class="badge ${o.status}">${STATUS_LABEL[o.status]}</span></span>
        <span class="time">${o.code}</span>
      </div>
      <div class="items">${escapeHtml(itemsLabel)}</div>
      <div class="meta">Nhận: ${formatDateTimeVN(o.pickup_at)} · Trả: ${formatDateTimeVN(o.return_due_at)}</div>
      <div class="meta">${money(o.rental_price)} · Cọc: ${money(o.deposit_amount)} (${DEPOSIT_LABEL[o.deposit_type]})</div>
      <div class="actions"><button class="btn secondary block-sm" data-action="open-order" data-id="${o.id}">Chi tiết</button></div>
    </div>`;
  }).join('');
  listEl.querySelectorAll('[data-action="open-order"]').forEach(b=>b.addEventListener('click',()=>openOrderDetail(b.dataset.id)));
}

function getOrderDatesMsFromForm(pickupId, returnId){
  const pickupVal = document.getElementById(pickupId).value;
  const returnVal = document.getElementById(returnId).value;
  if(!pickupVal || !returnVal) return null;
  const pickupISO = vnLocalInputToISO(pickupVal);
  const returnISO = vnLocalInputToISO(returnVal);
  if(!pickupISO || !returnISO) return null;
  const startMs = new Date(pickupISO).getTime();
  const endMs = new Date(returnISO).getTime();
  if(!(endMs > startMs)) return null;
  return {startMs, endMs};
}

/**
 * Gắn logic cho khối item-picker vừa render (search chọn nhiều món, check trùng lịch ngay khi
 * chọn, giá gợi ý tự điền khi ô tiền chưa bị sửa tay, thêm món nhanh).
 * opts: {idPrefix, pickupId, returnId, priceFieldId, depositFieldId, excludeOrderId, initialEntries, saveBtnSelector}
 * Trả về {state, recomputeAll} để form cha gọi recomputeAll() khi đổi ngày giờ.
 */
function wireItemPickerBlock(opts){
  const state = {
    entries: (opts.initialEntries || []).slice(),
    scheduleCtx: null,
    priceDirty: false,
    depositDirty: false
  };
  const searchInput = document.getElementById(`${opts.idPrefix}-item-search`);
  const resultsEl = document.getElementById(`${opts.idPrefix}-item-results`);
  const selectedEl = document.getElementById(`${opts.idPrefix}-item-selected`);
  const priceField = document.getElementById(opts.priceFieldId);
  const depositField = document.getElementById(opts.depositFieldId);
  const quickAddBtn = document.getElementById(`${opts.idPrefix}-item-quickadd`);
  const quickAddBox = document.getElementById(`${opts.idPrefix}-quickadd-box`);
  const ctxErrorEl = document.getElementById(`${opts.idPrefix}-schedule-ctx-error`);
  const priceHintEl = document.getElementById(`${opts.idPrefix}-price-suggest-hint`);

  priceField.addEventListener('input', ()=>{ state.priceDirty = true; });
  depositField.addEventListener('input', ()=>{ state.depositDirty = true; });

  function getDatesMs(){
    return getOrderDatesMsFromForm(opts.pickupId, opts.returnId);
  }

  function setSaveDisabled(disabled){
    if(opts.saveBtnSelector){
      const saveBtn = document.querySelector(opts.saveBtnSelector);
      if(saveBtn) saveBtn.disabled = disabled;
    }
  }

  // audit-phase2 #3: query lỗi (mạng, RLS...) KHÔNG được cache thành context rỗng vĩnh viễn —
  // bản cũ set {orders:[],orderItems:[]} khi lỗi khiến check trùng tắt âm thầm mãi mãi. Giữ
  // scheduleCtx=null để còn thử lại, khóa nút Lưu + hiện banner báo lỗi có nút "Thử lại".
  async function ensureScheduleCtx(){
    if(state.scheduleCtx) return state.scheduleCtx;
    // B9: join tên khách để cảnh báo trùng lịch hiện được tên khách (không chỉ mã đơn).
    const [ordersRes, orderItemsRes] = await Promise.all([
      sb.from('orders').select('id,code,status,pickup_at,return_due_at,customer:customers(name)'),
      sb.from('order_items').select('order_id,item_id')
    ]);
    if(ordersRes.error || orderItemsRes.error){
      state.scheduleCtx = null;
      if(ctxErrorEl) ctxErrorEl.classList.remove('hidden');
      setSaveDisabled(true);
      return null;
    }
    if(ctxErrorEl) ctxErrorEl.classList.add('hidden');
    const orders = ordersRes.data||[];
    const nameByOrderId = {};
    orders.forEach(o=>{ nameByOrderId[o.id] = o.customer && o.customer.name ? o.customer.name : ''; });
    state.scheduleCtx = {orders, orderItems: orderItemsRes.data||[], nameByOrderId};
    return state.scheduleCtx;
  }
  // B9: nhãn cảnh báo trùng lịch — "⚠️ Trùng với đơn {tên khách} ({dd/MM} → {dd/MM})",
  // không có tên khách thì rơi về mã đơn như cũ.
  function conflictOrderLabel(conflict){
    const who = (state.scheduleCtx && state.scheduleCtx.nameByOrderId[conflict.orderId]) || conflict.orderCode || '';
    const startLabel = formatShortDateVN(new Date(conflict.busyStartMs).toISOString());
    const endLabel = conflict.busyEndMs===Infinity ? '?' : formatShortDateVN(new Date(conflict.busyEndMs).toISOString());
    return `⚠️ Trùng với đơn ${who} (${startLabel} → ${endLabel})`;
  }
  document.getElementById(`${opts.idPrefix}-schedule-ctx-retry`)?.addEventListener('click', async ()=>{
    await ensureScheduleCtx();
    recomputeAll();
  });

  function conflictForItem(item){
    const dates = getDatesMs();
    if(!dates || !state.scheduleCtx) return null;
    const busy = itemBusyIntervals(item, state.scheduleCtx.orders, state.scheduleCtx.orderItems, Date.now());
    // Audit-batch-UX-1 #4: 'giat'/'sua' chỉ chặn nếu khoảng đặt bắt đầu trong 24h tới (hoặc đã bắt
    // đầu); đặt xa hơn 24h thì coi như 'ok' (đủ thời gian giặt/sửa xong trước đó). 'hong'/'nghi' luôn chặn.
    const isTemporaryManual = item.manual_status==='giat' || item.manual_status==='sua';
    const startsFarFuture = dates.startMs > Date.now() + 24*3600000;
    const effectiveManualStatus = (isTemporaryManual && startsFarFuture) ? 'ok' : item.manual_status;
    return checkConflict(item.id, dates.startMs, dates.endMs, item.buffer_hours, busy, opts.excludeOrderId, effectiveManualStatus);
  }

  function paintSelected(){
    if(!state.entries.length){
      selectedEl.innerHTML = `<div class="empty-state">Chưa chọn món nào từ kho</div>`;
      return;
    }
    selectedEl.innerHTML = state.entries.map((entry, idx)=>{
      const c = entry.conflict;
      let warnHtml = '';
      if(c && c.reason==='schedule'){
        warnHtml += `<div class="picked-item-conflict-msg">${escapeHtml(conflictOrderLabel(c))}</div>`;
      } else if(c && c.reason==='manual_status'){
        warnHtml += `<div class="picked-item-conflict-msg">⚠️ Đang ${MANUAL_STATUS_LABEL[c.manualStatus]||c.manualStatus}</div>`;
      }
      if(entry.priceMissing){
        // audit-phase2 #6: món không có giá gợi ý (thiếu cả giá ngày lẫn giá giờ) → không tự
        // điền 0đ vào ô tiền, báo rõ để chủ tiệm nhập tay giá cho món này.
        warnHtml += `<div class="picked-item-conflict-msg" style="color:#b45309;">⚠️ Món chưa có giá — nhập tay</div>`;
      }
      return `<div class="picked-item-row ${c?'conflict':''}" data-idx="${idx}">
        <div style="flex:1;">
          <div>${escapeHtml(entry.item.name)} <span style="color:var(--muted);font-size:13px;">(${entry.item.code})</span></div>
          ${warnHtml}
        </div>
        <input type="text" inputmode="numeric" class="picked-item-price" data-idx="${idx}" value="${Number(entry.price||0).toLocaleString('vi-VN')}">
        <button type="button" class="btn ghost picked-item-remove" data-idx="${idx}">✕</button>
      </div>`;
    }).join('');
    selectedEl.querySelectorAll('.picked-item-price').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const idx = Number(inp.dataset.idx);
        const raw = parseMoneyInput(inp.value);
        inp.value = raw ? raw.toLocaleString('vi-VN') : '';
        state.entries[idx].priceTouched = true;
        state.entries[idx].price = raw;
        if(!state.priceDirty){
          const total = state.entries.reduce((s,e)=>s+Number(e.price||0),0);
          priceField.value = total ? total.toLocaleString('vi-VN') : '';
        }
      });
    });
    selectedEl.querySelectorAll('.picked-item-remove').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = Number(btn.dataset.idx);
        state.entries.splice(idx,1);
        recomputeAll();
      });
    });
  }

  // audit-phase2 #7: hiện gợi ý "Tổng món: X đ [Áp dụng]" khi tổng giá gợi ý các món khác với
  // ô tiền thuê hiện tại, thay vì tự ghi đè âm thầm (form sửa đơn khoá priceDirty=true nên trước
  // đây thêm/bớt món không cập nhật tiền, lệch âm thầm mà không ai biết).
  function updatePriceSuggestHint(){
    if(!priceHintEl) return;
    const total = state.entries.reduce((s,e)=>s+Number(e.price||0),0);
    const current = parseMoneyInput(priceField.value);
    if(total > 0 && total !== current){
      priceHintEl.classList.remove('hidden');
      priceHintEl.innerHTML = `Tổng gợi ý theo món: ${money(total)} <button type="button" class="btn ghost block-sm" id="${opts.idPrefix}-apply-suggested-price">Áp dụng</button>`;
      document.getElementById(`${opts.idPrefix}-apply-suggested-price`)?.addEventListener('click', ()=>{
        priceField.value = total.toLocaleString('vi-VN');
        state.priceDirty = true;
        priceHintEl.classList.add('hidden');
      });
    } else {
      priceHintEl.classList.add('hidden');
      priceHintEl.innerHTML = '';
    }
  }

  function recomputeAll(){
    const dates = getDatesMs();
    const hours = dates ? (dates.endMs-dates.startMs)/3600000 : 0;
    let anyConflict = false;
    state.entries.forEach(entry=>{
      entry.conflict = conflictForItem(entry.item);
      if(entry.conflict) anyConflict = true;
      if(!entry.priceTouched && dates){
        entry.price = computeItemSuggestedPrice(entry.item, hours);
        entry.priceMissing = entry.price === 0;
      }
    });
    paintSelected();
    if(!state.priceDirty){
      // audit-phase2 #6: nếu tổng gợi ý = 0 (món chưa có giá) thì KHÔNG ghi đè ô tiền về rỗng/0 —
      // giữ nguyên giá trị hiện có, cảnh báo hiện riêng theo từng dòng món (entry.priceMissing).
      const total = state.entries.reduce((s,e)=>s+Number(e.price||0),0);
      if(total > 0) priceField.value = total.toLocaleString('vi-VN');
    }
    updatePriceSuggestHint();
    if(!state.depositDirty){
      const totalDep = state.entries.reduce((s,e)=>s+Number(e.item.deposit_value||0),0);
      depositField.value = totalDep ? totalDep.toLocaleString('vi-VN') : '';
    }
    // audit-phase2 #3: ngoài anyConflict, khoá luôn nút Lưu nếu context lịch chưa tải được (lỗi)
    // — trước đây scheduleCtx lỗi vẫn coi như "không trùng" và cho lưu bình thường.
    setSaveDisabled(anyConflict || !state.scheduleCtx);
  }

  async function tryAddItem(item){
    const ctx = await ensureScheduleCtx();
    if(!ctx){ toast('Chưa kiểm tra được lịch — thử lại trước khi thêm món'); return; }
    if(state.entries.some(e=>e.item.id===item.id)){ toast('Món này đã được chọn'); return; }
    const conflict = conflictForItem(item);
    if(conflict){
      if(conflict.reason==='schedule'){
        toast(`${conflictOrderLabel(conflict)} — không thể thêm`);
      } else {
        toast(`⚠️ Món đang ${MANUAL_STATUS_LABEL[conflict.manualStatus]||conflict.manualStatus}, không thể thêm`);
      }
      return;
    }
    const dates = getDatesMs();
    const hours = dates ? (dates.endMs-dates.startMs)/3600000 : 0;
    const price = dates ? computeItemSuggestedPrice(item, hours) : Number(item.rent_price_day||0);
    state.entries.push({item, price, priceTouched:false, priceMissing: price===0, conflict:null});
    searchInput.value = '';
    resultsEl.innerHTML = '';
    recomputeAll();
  }

  let searchDebounce = null;
  searchInput.addEventListener('input', ()=>{
    clearTimeout(searchDebounce);
    const rawTerm = searchInput.value.trim();
    if(!rawTerm){ resultsEl.innerHTML=''; return; }
    // audit-phase2 #5: bỏ ký tự có thể làm vỡ cú pháp .or()/.ilike() của PostgREST (dấu phẩy,
    // ngoặc, %, *) — trước đây gõ các ký tự này làm query lỗi, lỗi bị nuốt im lặng, hiện luôn
    // "Không tìm thấy" khiến chủ tiệm tưởng chưa có món và tạo trùng.
    const term = rawTerm.replace(/[,()%*]/g, '').trim();
    if(!term){ resultsEl.innerHTML = `<div class="item-search-result-row">Không tìm thấy</div>`; return; }
    searchDebounce = setTimeout(async ()=>{
      const {data, error} = await sb.from('items').select('*').or(`name.ilike.%${term}%,code.ilike.%${term}%`).limit(15);
      if(error){
        resultsEl.innerHTML = `<div class="item-search-result-row">Lỗi tìm kiếm, thử lại</div>`;
        toast('Lỗi tìm món: '+viError(error), 4000);
        return;
      }
      const list = (data||[]).filter(it=>!state.entries.some(e=>e.item.id===it.id));
      if(!list.length){ resultsEl.innerHTML = `<div class="item-search-result-row">Không tìm thấy</div>`; return; }
      resultsEl.innerHTML = list.map(it=>`<div class="item-search-result-row" data-item-id="${it.id}">${escapeHtml(it.name)} <span style="color:var(--muted);">(${it.code})</span> — ${money(it.rent_price_day)}/ngày</div>`).join('');
      resultsEl.querySelectorAll('[data-item-id]').forEach(row=>{
        row.addEventListener('click', ()=>{
          const it = list.find(x=>x.id===row.dataset.itemId);
          if(it) tryAddItem(it);
        });
      });
    }, 250);
  });

  quickAddBtn.addEventListener('click', ()=>{
    quickAddBox.classList.toggle('hidden');
  });
  document.getElementById(`${opts.idPrefix}-qa-cancel`).addEventListener('click', ()=>{
    quickAddBox.classList.add('hidden');
  });
  attachMoneyFormatting(document.getElementById(`${opts.idPrefix}-qa-price`));
  document.getElementById(`${opts.idPrefix}-qa-save`).addEventListener('click', async ()=>{
    const btn = document.getElementById(`${opts.idPrefix}-qa-save`);
    const name = document.getElementById(`${opts.idPrefix}-qa-name`).value.trim();
    if(!name){ toast('Nhập tên món'); return; }
    const category = document.getElementById(`${opts.idPrefix}-qa-category`).value;
    const priceDay = parseMoneyInput(document.getElementById(`${opts.idPrefix}-qa-price`).value);
    btn.disabled = true;
    const {data, error} = await sb.from('items').insert({
      name, category, rent_price_day: priceDay,
      buffer_hours: DEFAULT_BUFFER_BY_CATEGORY[category]
    }).select().single();
    btn.disabled = false;
    if(error){ toast('Lỗi tạo món: '+viError(error), 4000); return; }
    document.getElementById(`${opts.idPrefix}-qa-name`).value = '';
    document.getElementById(`${opts.idPrefix}-qa-price`).value = '';
    quickAddBox.classList.add('hidden');
    await tryAddItem(data);
  });

  // Load sẵn schedule context rồi tính conflict cho các món đã có (trường hợp sửa đơn)
  ensureScheduleCtx().then(()=>recomputeAll());

  return {state, recomputeAll};
}

// B3: "Nhận lúc" mặc định = hôm nay, giờ tròn kế tiếp (VN). Múi giờ VN là UTC+7 cố định (không DST)
// nên mốc giờ tròn theo UTC cũng chính là mốc giờ tròn theo giờ VN.
function defaultPickupLocalInput(){
  const now = Date.now();
  const nextRoundHourMs = Math.ceil(now/3600000)*3600000;
  return isoToVnLocalInput(new Date(nextRoundHourMs).toISOString());
}

  openModal(`

      <div class="field"><label>Số điện thoại</label><input type="tel" id="f-phone"></div>
